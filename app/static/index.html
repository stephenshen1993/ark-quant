<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ark-quant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen antialiased">

<!-- 侧边导航 -->
<nav class="w-40 bg-white border-r border-gray-200 flex flex-col pt-6 px-3 gap-1 shrink-0">
  <span class="text-xs text-gray-400 font-medium px-2 mb-2">ark-quant</span>
  <template x-data x-for="item in [
    {id:'account', label:'账户', icon:'📊'},
    {id:'trading', label:'计划', icon:'📋'}
  ]">
    <button @click="$dispatch('nav', item.id)"
      :class="$store.page === item.id
        ? 'bg-gray-100 text-gray-900 font-medium'
        : 'text-gray-500 hover:bg-gray-50'"
      class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-left w-full">
      <span x-text="item.icon"></span>
      <span x-text="item.label"></span>
    </button>
  </template>
</nav>

<!-- 主内容 -->
<main class="flex-1 overflow-auto p-8" x-data @nav.window="$store.page = $event.detail">

  <!-- 账户总览 -->
  <div x-show="$store.page === 'account'" x-data="accountPage()" x-init="ensureLoaded($store.page)" x-effect="ensureLoaded($store.page)">

    <div class="max-w-7xl">
      <!-- 标题栏 -->
      <div class="flex justify-between items-center mb-5">
        <div>
          <h1 class="text-xl font-semibold tracking-normal">账户</h1>
        </div>
        <label class="text-xs text-gray-500 flex items-center gap-2">
          账户事实日
          <input type="date" x-model="form.snapshot_date" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 bg-white">
        </label>
      </div>

      <!-- 总资产 -->
      <section class="bg-white border border-gray-100 rounded-xl p-6 mb-5 shadow-sm shadow-gray-100/40">
        <div class="flex items-baseline gap-3">
          <span class="text-sm text-gray-400">总资产</span>
          <span class="text-4xl font-semibold tracking-normal tabular-nums" x-text="fmtMoney(totalAssets())"></span>
        </div>
        <div x-show="!summary" class="text-sm text-gray-400 mt-2">暂无账户数据。</div>
      </section>

      <!-- 账户列表 -->
      <table class="w-full table-fixed bg-white border border-gray-100 rounded-xl shadow-sm shadow-gray-100/40">
        <template x-for="acc in accounts" :key="acc.id">
          <tbody>
            <tr @click="acc.posType ? toggleExpand(acc.id) : null"
              :class="acc.posType ? 'cursor-pointer hover:bg-gray-50' : ''"
              class="border-b border-gray-50 last:border-b-0">
              <td class="pl-5 py-3.5" style="width:32px"><div :style="'background:' + acc.color" class="w-2.5 h-2.5 rounded-full"></div></td>
              <td class="py-3.5 pr-4"><span class="text-sm font-medium" x-text="acc.label"></span><span class="text-xs text-gray-400 ml-2" x-text="acc.sub"></span></td>
              <td class="py-3.5 pr-4 text-right"><span x-show="acc.posType" class="text-sm font-semibold tabular-nums" x-text="fmtMoney(num(form[acc.totalKey]))"></span><span x-show="!acc.posType"><span x-show="editingSimple === acc.id" class="flex items-baseline gap-1 justify-end"><span class="text-sm text-gray-400">¥</span><input type="text" inputmode="decimal" x-model="form[acc.totalKey]" @blur="saveSimpleAccount(acc.id)" @keyup.enter="$el.blur()" x-init="$el.focus()" class="text-sm font-semibold tabular-nums bg-transparent text-right outline-none border-b border-gray-200 w-28" placeholder="0"></span><span x-show="editingSimple !== acc.id" @click.stop="editingSimple = acc.id" class="text-sm font-semibold tabular-nums cursor-pointer" x-text="fmtMoney(num(form[acc.totalKey]))"></span></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400 tabular-nums"><span x-text="acctPct(acc)"></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400"><span x-text="accUpdateDate(acc)"></span></td>
              <td class="py-3.5 pr-5 text-center" style="width:28px"><span x-show="acc.posType" class="text-gray-300 text-sm" x-text="expanded === acc.id ? '▾' : '▸'"></span></td>
            </tr>
            <tr x-show="expanded === 'stock' && acc.id === 'stock'" class="border-b border-gray-50">
              <td colspan="6" class="bg-gray-50/30 px-5 py-4">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-gray-400">可用 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.stock_available_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">冻结 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.stock_frozen_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">现金总额 <span x-text="fmtMoney(accountCash('stock'))"></span></span>
              </div>
              <table class="w-full table-fixed text-sm"><thead><tr class="text-xs text-gray-400 border-b border-gray-200"><th class="text-left font-normal py-1.5">代码</th><th class="text-left font-normal py-1.5">名称</th><th class="text-right font-normal py-1.5">股数</th><th class="text-right font-normal py-1.5">现价</th><th class="text-right font-normal py-1.5">市值</th><th class="text-right font-normal py-1.5">占比</th><th style="width:24px"></th></tr></thead>
              <tbody><template x-for="row in stockRows" :key="row._id"><tr class="border-b border-gray-100"><td class="py-1.5"><template x-if="row.isNew"><input type="text" x-model="row.code" @change="autofill('stock', row)" placeholder="代码" style="border:none;border-bottom:1px solid #d1d5db;background:transparent;outline:none;padding:1px 0;font-size:12px;width:5em;"></template><span x-show="!row.isNew" class="text-xs text-gray-500" x-text="row.code"></span></td><td class="py-1.5 text-gray-700 font-medium text-xs" x-text="row.name || '—'"></td><td class="py-1.5 text-right"><input type="number" min="0" step="100" x-model.number="row.shares" @input.debounce.600ms="scheduleSortRows('stock')" style="border:none;border-bottom:1px solid #e5e7eb;background:transparent;outline:none;padding:1px 0 1px 0;text-align:right;font-size:12px;width:5em;padding-right:0;"></td><td class="py-1.5 text-right text-xs text-gray-500" x-text="rowPrice('stock', row.code)?.toFixed(2) ?? '-'"></td><td class="py-1.5 text-right text-xs text-gray-800 tabular-nums" x-text="rowValue('stock', row) != null ? fmtMoney(rowValue('stock', row)) : '-'"></td><td class="py-1.5 text-right text-xs text-gray-400" x-text="rowWeight('stock', row) != null ? (rowWeight('stock', row)*100).toFixed(1)+'%' : '-'"></td><td class="py-1.5 text-center"><button @click="removeRow('stock', row)" class="text-gray-300 hover:text-red-400 text-xs">✕</button></td></tr></template></tbody></table>
              <div x-show="stockRows.length === 0" class="text-xs text-gray-400 py-2">暂无持仓</div>
              <div class="flex items-center gap-3 mt-3"><button @click="addRow('stock')" class="text-xs text-gray-400 hover:text-gray-600">＋ 添加行</button><button @click="saveAccount('stock')" class="text-xs px-3 py-1 bg-gray-800 text-white rounded-md hover:bg-gray-700">保存</button><span x-show="stockSaved" class="text-xs text-green-600">已保存</span></div>
              </td>
            </tr>
            <tr x-show="expanded === 'cb' && acc.id === 'cb'" class="border-b border-gray-50">
              <td colspan="6" class="bg-gray-50/30 px-5 py-4">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-gray-400">可用 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.bond_available_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">冻结 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.bond_frozen_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">现金总额 <span x-text="fmtMoney(accountCash('cb'))"></span></span>
              </div>
              <table class="w-full table-fixed text-sm"><thead><tr class="text-xs text-gray-400 border-b border-gray-200"><th class="text-left font-normal py-1.5">代码</th><th class="text-left font-normal py-1.5">名称</th><th class="text-right font-normal py-1.5">张数</th><th class="text-right font-normal py-1.5">现价</th><th class="text-right font-normal py-1.5">市值</th><th class="text-right font-normal py-1.5">占比</th><th style="width:24px"></th></tr></thead>
              <tbody><template x-for="row in cbRows" :key="row._id"><tr class="border-b border-gray-100"><td class="py-1.5"><template x-if="row.isNew"><input type="text" x-model="row.code" @change="autofill('cb', row)" placeholder="代码" style="border:none;border-bottom:1px solid #d1d5db;background:transparent;outline:none;padding:1px 0;font-size:12px;width:5em;"></template><span x-show="!row.isNew" class="text-xs text-gray-500" x-text="row.code"></span></td><td class="py-1.5 text-gray-700 font-medium text-xs" x-text="row.name || '—'"></td><td class="py-1.5 text-right"><input type="number" min="0" step="10" x-model.number="row.shares" @input.debounce.600ms="scheduleSortRows('cb')" style="border:none;border-bottom:1px solid #e5e7eb;background:transparent;outline:none;padding:1px 0 1px 0;text-align:right;font-size:12px;width:5em;padding-right:0;"></td><td class="py-1.5 text-right text-xs text-gray-500" x-text="rowPrice('cb', row.code)?.toFixed(2) ?? '-'"></td><td class="py-1.5 text-right text-xs text-gray-800 tabular-nums" x-text="rowValue('cb', row) != null ? fmtMoney(rowValue('cb', row)) : '-'"></td><td class="py-1.5 text-right text-xs text-gray-400" x-text="rowWeight('cb', row) != null ? (rowWeight('cb', row)*100).toFixed(1)+'%' : '-'"></td><td class="py-1.5 text-center"><button @click="removeRow('cb', row)" class="text-gray-300 hover:text-red-400 text-xs">✕</button></td></tr></template></tbody></table>
              <div x-show="cbRows.length === 0" class="text-xs text-gray-400 py-2">暂无持仓</div>
              <div class="flex items-center gap-3 mt-3"><button @click="addRow('cb')" class="text-xs text-gray-400 hover:text-gray-600">＋ 添加行</button><button @click="saveAccount('cb')" class="text-xs px-3 py-1 bg-gray-800 text-white rounded-md hover:bg-gray-700">保存</button><span x-show="cbSaved" class="text-xs text-green-600">已保存</span></div>
              </td>
            </tr>
          </tbody>
        </template>
      </table>
    </div>
  </div>

<!-- 计划 -->
  <template x-if="$store.page === 'trading'">
  <div x-data="tradingPage()" class="max-w-7xl mx-auto">
    <!-- 计划基准与唯一主操作 -->
    <div class="flex flex-col xl:flex-row xl:items-center gap-4 mb-5 p-4 bg-white border border-gray-100 rounded-xl shadow-sm">
      <div>
        <h1 class="text-xl font-semibold">生成计划</h1>
        <div class="text-xs text-gray-400 mt-1" x-text="tDate ? '基于 ' + tDate + ' 收盘数据' : '等待计划基准日'"></div>
      </div>
      <span x-show="executionDate()" class="text-xs text-green-600 bg-green-50 px-3 py-1.5 rounded-full"
        x-text="'适用 ' + executionDate() + ' 开盘执行'"></span>
      <div class="flex flex-wrap items-center gap-2 xl:ml-auto">
        <span class="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2">
          温度 <span class="text-gray-700 font-medium tabular-nums" x-text="temperatureText()"></span>
        </span>
        <span x-show="temperatureLabel()" class="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2"
          x-text="temperatureLabel()"></span>
        <span x-show="temperatureUpdatedAt()" class="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2"
          x-text="'更新 ' + temperatureUpdatedAt()"></span>
        <button @click="generateCompletePlan()" :disabled="loadingPlan" class="px-4 py-2 bg-gray-900 text-white text-sm rounded-lg hover:bg-gray-700 disabled:bg-gray-400">
          <span x-show="!loadingPlan">生成完整计划</span><span x-show="loadingPlan" x-text="generationStage ? generationStage + '…' : '正在生成…'"></span>
        </button>
      </div>
    </div>

    <!-- 本次计划条件 -->
    <section class="bg-white border border-gray-100 rounded-xl p-5 mb-4 shadow-sm shadow-gray-100/40">
      <div class="mb-3">
        <div class="text-sm font-semibold">本次计划条件</div>
        <div class="text-xs text-gray-400 mt-1">账户余额和持仓在“账户”页维护；这里只填写本次计划特有的事实。</div>
      </div>
      <div x-show="funding.check_type === 'a_internal'" class="text-sm text-gray-700 bg-gray-50 rounded-lg px-3 py-3">
        <div class="font-medium">日常计划（主动组合内部）</div>
        <div class="text-xs text-gray-400 mt-1">检查股票、转债和现金之间是否需要调拨，并生成交易计划；不调整长期组合之间的既有资金。</div>
      </div>
      <details class="mt-3 text-sm" :open="funding.check_type !== 'a_internal'">
        <summary class="cursor-pointer text-xs text-gray-500 select-none">特殊情况</summary>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
          <label class="text-xs text-gray-500">本次计划场景
            <select x-model="funding.check_type" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm text-gray-700">
              <option value="a_internal">日常计划（主动组合内部）</option>
              <option value="monthly_contribution">新增资金分配</option>
              <option value="quarterly">季度组合再平衡</option>
              <option value="b_recovery">海外长钱恢复申购</option>
              <option value="ad_hoc">临时专项检查</option>
            </select>
          </label>
          <label x-show="needsContribution()" class="text-xs text-gray-500">本次新增本金（元）
            <input type="text" inputmode="decimal" x-model="funding.new_contribution" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm" placeholder="0">
          </label>
          <div x-show="needsBCheck()" class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3">
          <label class="text-xs text-gray-500">海外长钱（QDII）申购状态
            <select x-model="funding.b_purchase_status" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm text-gray-700">
              <option value="unchecked">尚未核验</option>
              <option value="unavailable">已核验，不可申购</option>
              <option value="available">已核验，可申购</option>
            </select>
          </label>
          <label x-show="funding.b_purchase_status === 'available'" class="text-xs text-gray-500">海外长钱单次实际可申购额度（元）
            <input type="text" inputmode="decimal" x-model="funding.b_purchase_limit" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm" placeholder="0">
          </label>
          <label x-show="funding.b_purchase_status !== 'unchecked'" class="text-xs text-gray-500">海外长钱额度核验时间
            <input type="datetime-local" x-model="funding.b_purchase_checked_at" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm">
          </label>
          <label x-show="funding.b_purchase_status !== 'unchecked'" class="text-xs text-gray-500">海外长钱额度核验来源
            <input type="text" x-model="funding.b_purchase_source" class="mt-1 w-full border border-gray-200 rounded px-2 py-1.5 text-sm" placeholder="如：券商页面人工核验">
          </label>
          <div x-show="funding.b_purchase_status === 'unchecked'" class="md:col-span-2 text-xs text-amber-600 bg-amber-50 rounded-lg px-3 py-2">尚未核验时，计划会安全地把海外长钱按不可申购处理，但不会冒充“已核验不可申购”。</div>
          </div>
        </div>
      </details>
    </section>

    <div x-show="planError" class="bg-red-50 border border-red-200 rounded-xl p-3 mb-4 text-sm text-red-700 whitespace-pre-line" x-text="planError"></div>

    <!-- 就绪状态 -->
    <section class="bg-white border border-gray-100 rounded-xl p-4 mb-4 shadow-sm shadow-gray-100/40">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold">计划就绪状态</div>
        <div class="text-xs text-gray-400">榜单生成受盘中保护；盘中可查看已有计划。</div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <template x-for="item in readinessItems()" :key="item.label">
          <div class="rounded-lg border px-3 py-2" :class="statusClass(item.state)">
            <div class="text-xs font-medium" x-text="item.label"></div>
            <div class="text-xs mt-1 opacity-80" x-text="item.text"></div>
          </div>
        </template>
      </div>
    </section>

    <details class="bg-white border border-gray-100 rounded-xl px-4 py-3 mb-4 text-sm shadow-sm shadow-gray-100/40">
      <summary class="cursor-pointer text-xs text-gray-500 select-none">高级操作</summary>
      <div class="flex flex-wrap items-center gap-2 mt-3">
        <button @click="refreshFullPlan(true)" :disabled="loadingPlan" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 disabled:text-gray-300">更新市场温度</button>
        <button @click="runStrategy('cb')" :disabled="running.cb || loadingPlan" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 disabled:text-gray-300">生成转债榜单</button>
        <button @click="runStrategy('stock')" :disabled="running.stock || loadingPlan" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 disabled:text-gray-300">生成股票榜单</button>
        <span class="text-xs text-gray-400">这些操作只准备计划数据，不会执行交易。</span>
      </div>
      <template x-for="strategy in ['cb', 'stock']" :key="strategy">
        <div x-show="componentErrors[strategy]" class="text-xs text-red-600 mt-2" x-text="componentErrors[strategy]"></div>
      </template>
    </details>

    <!-- 资金调拨结果始终可见 -->
    <div class="bg-white border border-gray-100 rounded-xl p-5 mb-4 shadow-sm shadow-gray-100/40">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold">资金调拨</div>
        <span class="text-xs rounded-full px-2.5 py-1" :class="statusClass(plan?.fund_transfer ? 'ready' : 'waiting')" x-text="transferStatusText()"></span>
      </div>
      <template x-for="(step, i) in transferSteps()">
        <div class="flex gap-3 text-sm text-gray-700 py-2 border-b border-gray-50 last:border-0">
          <span class="text-xs w-5 h-5 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center shrink-0" x-text="i+1"></span>
          <span x-text="step"></span>
        </div>
      </template>
      <div x-show="plan && !transferSteps().length" class="text-sm text-gray-500 py-2">无需资金调拨</div>
      <div x-show="!plan" class="text-sm text-gray-400 py-2">等待生成计划。</div>
    </div>

    <!-- 转债计划 -->
    <div class="bg-white border border-gray-100 rounded-xl p-5 mb-4 shadow-sm shadow-gray-100/40">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold">转债计划
          <span class="text-xs text-gray-400 font-normal ml-2" x-text="plan?.cb?.data_date ? '基于 ' + plan?.cb?.data_date + ' 收盘' : ''"></span>
        </div>
        <div class="flex gap-2 items-center">
          <button @click="exportMd('cb')" class="px-2 py-1 border border-gray-200 bg-white text-xs rounded hover:bg-gray-50" x-show="cbItems.length">导出</button>
          <span class="text-xs rounded-full px-2.5 py-1" :class="statusClass(strategyStatus('cb').state)" x-text="strategyStatus('cb').text"></span>
        </div>
      </div>
      <div x-show="componentErrors.cb" class="bg-red-50 border border-red-200 rounded-xl p-3 mb-3 text-sm text-red-700" x-text="componentErrors.cb"></div>
      <!-- 排名表 -->
      <div x-show="cbItems.length && !plan?.cb?.orders?.length" class="mb-4">
        <div class="text-xs text-gray-400 mb-2" x-text="cbTradeDate ? '基于 ' + cbDate + ' 收盘 · 适用 ' + cbTradeDate + ' 开盘执行' : ''"></div>
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-xs text-gray-400"><tr>
            <th class="text-center px-3 py-2 w-10 font-normal">#</th><th class="text-left px-2 py-2 font-normal">代码</th><th class="text-left px-2 py-2 font-normal">名称</th><th class="text-right px-2 py-2 font-normal">价格</th><th class="text-right px-2 py-2 font-normal">溢价率</th><th class="text-right px-2 py-2 font-normal">双低值</th><th class="text-right px-3 py-2 font-normal">评分</th>
          </tr></thead>
          <tbody>
            <template x-for="r in cbItems" :key="r.bond_code">

<script>
  // Alpine store for active page
  document.addEventListener('alpine:init', () => {
    Alpine.store('page', 'account')
  })

  function localDate() {
    const now = new Date()
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    return local.toISOString().slice(0, 10)
  }

  // 账户总览（含持仓）
  function accountPage() {
    return {
      summary: null,
      expanded: null, editingSimple: null,
      cbSaved: false, stockSaved: false,
      cbRows: [], stockRows: [],
      prices: { stock: {}, cb: {} },   // code -> {name, price}
      loaded: { stock: false, cb: false },
      _uid: 0,
      _sortTimers: {},
      loadedOnce: false,
      accounts: [
        { id: 'stock',    label: '广发账户', sub: '股票仓位',   color: '#8b5cf6', totalKey: 'stock_total',     cashKey: 'stock_cash', posType: 'stock' },
        { id: 'cb',       label: '华泰账户', sub: '转债仓位',   color: '#14b8a6', totalKey: 'bond_total',      cashKey: 'bond_cash',  posType: 'cb'    },
        { id: 'changqian',label: '长钱账户', sub: '国内基金',   color: '#f59e0b', totalKey: 'changqian_total', posType: null    },
        { id: 'overseas', label: '海外长钱', sub: '海外基金',   color: '#60a5fa', totalKey: 'overseas_total',  posType: null    },
        { id: 'cash',     label: '资金账户', sub: '现金仓位',   color: '#9ca3af', totalKey: 'cash_pool',       posType: null    },
      ],
      form: {
        snapshot_date: localDate(),
        temperature: null, stock_total: null, stock_available_cash: null, stock_frozen_cash: 0,
        bond_total: null, bond_available_cash: null, bond_frozen_cash: 0, changqian_total: null,
        cash_pool: null, overseas_total: null,
        _stock_updated: '', _cb_updated: '',
      },
      async load() {
        const summary = await fetch('/api/account/summary').then(r => r.json())
        this.applySummary(summary)
        const positionDate = this.form.snapshot_date
        const [cb, stock] = await Promise.all([
          fetch(`/api/positions/cb?date=${positionDate}&asof=true`).then(r => r.json()),
          fetch(`/api/positions/stock?date=${positionDate}&asof=true`).then(r => r.json()),
        ])
        this.cbRows = cb.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        this.stockRows = stock.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        // per-account 更新日期
        const contextDate = summary?.context?.snapshot_date || ''
        this.form._stock_updated = stock.length > 0 ? stock[0].position_date : contextDate
        this.form._cb_updated = cb.length > 0 ? cb[0].position_date : contextDate
        // 自动加载行情
        await Promise.all([this.loadQuotes('stock'), this.loadQuotes('cb')])
      },
      ensureLoaded(page) {
        if (page !== 'account' || this.loadedOnce) return
        this.loadedOnce = true
        this.load().catch(err => {
          this.loadedOnce = false
          console.error(err)
        })
      },
      accountItem(id) {
        return (this.summary?.accounts || []).find(item => item.id === id) || null
      },
      applySummary(summary) {
        this.summary = summary
        if (!summary) return
        const context = summary.context || {}
        this.form.temperature = context.temperature ?? this.form.temperature
        ;(summary.accounts || []).forEach(item => {
          const acc = this.accounts.find(a => a.id === item.id)
          if (!acc) return
          this.form[acc.totalKey] = item.total
          if (acc.cashKey) {
            this.form[acc.cashKey.replace('_cash', '_available_cash')] = item.available_cash
            this.form[acc.cashKey.replace('_cash', '_frozen_cash')] = item.frozen_cash || 0
          }
        })
      },
      addRow(strategy) {
        const row = { code: '', name: '', shares: 0, _id: ++this._uid, isNew: true }
        ;(strategy === 'cb' ? this.cbRows : this.stockRows).push(row)
      },
      removeRow(strategy, row) {
        const rows = strategy === 'cb' ? this.cbRows : this.stockRows
        const i = rows.indexOf(row)
        if (i >= 0) rows.splice(i, 1)
      },
      fmtMoney(v) { return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
      num(v) { return Number.isFinite(Number(v)) ? Number(v) : 0 },
      totalAssets() {
        const f = this.form
        return this.num(f.stock_total) + this.num(f.bond_total) + this.num(f.changqian_total) + this.num(f.cash_pool) + this.num(f.overseas_total)
      },
      async loadQuotes(strategy) {
        const q = await fetch(`/api/positions/${strategy}/quotes?date=${this.form.snapshot_date}&asof=true`).then(r => r.json())
        const map = {}
        ;(q.items || []).forEach(it => { map[it.code] = { name: it.name, price: it.price } })
        this.prices[strategy] = map
        this.loaded[strategy] = true
        this.sortRowsByValue(strategy)
      },
      async autofill(strategy, row) {
        const code = String(row.code || '').trim()
        if (!code) return
        const q = await fetch(`/api/positions/${strategy}/quote?code=${code}`).then(r => r.json())
        if (q && q.price != null) {
          this.prices[strategy] = { ...this.prices[strategy], [String(code).padStart(6, '0')]: { name: q.name, price: q.price } }
          if (q.name) row.name = q.name
          this.scheduleSortRows(strategy)
        }
      },
      rowPrice(strategy, code) {
        return this.prices[strategy][String(code || '').padStart(6, '0')]?.price ?? null
      },
      rowValue(strategy, row) {
        const p = this.rowPrice(strategy, row.code)
        return p != null ? p * (row.shares || 0) : null
      },
      holdingsValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        return rows.reduce((s, r) => s + (this.rowValue(strategy, r) || 0), 0)
      },
      rowWeight(strategy, row) {
        const total = this.holdingsValue(strategy)
        const v = this.rowValue(strategy, row)
        return (total && v != null) ? v / total : null
      },
      accountCash(strategy) {
        const availableKey = strategy === 'stock' ? 'stock_available_cash' : 'bond_available_cash'
        const frozenKey = strategy === 'stock' ? 'stock_frozen_cash' : 'bond_frozen_cash'
        const raw = this.form[availableKey]
        if (raw !== null && raw !== undefined && raw !== '') return this.num(raw) + this.num(this.form[frozenKey])
        const accountId = strategy === 'stock' ? 'stock' : 'cb'
        return this.num(this.accountItem(accountId)?.cash)
      },
      accountAvailableCash(strategy) {
        const key = strategy === 'stock' ? 'stock_available_cash' : 'bond_available_cash'
        const raw = this.form[key]
        if (raw !== null && raw !== undefined && raw !== '') return this.num(raw)
        const accountId = strategy === 'stock' ? 'stock' : 'cb'
        return this.num(this.accountItem(accountId)?.available_cash)
      },
      accountTotal(strategy) {
        return this.holdingsValue(strategy) + this.accountCash(strategy)
      },
      sortRowsByValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        rows.sort((a, b) => (this.rowValue(strategy, b) || 0) - (this.rowValue(strategy, a) || 0))
      },
      scheduleSortRows(strategy) {
        clearTimeout(this._sortTimers[strategy])
        this._sortTimers[strategy] = setTimeout(() => this.sortRowsByValue(strategy), 250)
      },
      toggleExpand(id) { this.expanded = this.expanded === id ? null : id },
      acctPct(acc) {
        const total = this.totalAssets()
        return total > 0 ? (this.num(this.form[acc.totalKey]) / total * 100).toFixed(1) + '%' : '0%'
      },
      accUpdateDate(acc) {
        const accountDate = this.accountItem(acc.id)?.snapshot_date
        if (accountDate) return this.formatFactDate(accountDate)
        if (acc.posType) {
          const d = this.form['_' + acc.id + '_updated'] || ''
          return d ? this.formatFactDate(d) : ''
        }
        return this.form.snapshot_date ? this.formatFactDate(this.form.snapshot_date) : ''
      },
      formatFactDate(value) {
        if (!value) return ''
        return '事实日 ' + String(value).slice(0, 10)
      },
      async saveSimpleAccount(id) {
        this.editingSimple = null
        await this.saveAccountSnapshot(id)
      },
      accountSnapshotPayload(id) {
        const acc = this.accounts.find(a => a.id === id)
        const available_cash = id === 'stock' ? this.accountAvailableCash('stock')
          : id === 'cb' ? this.accountAvailableCash('cb')
          : null
        const frozen_cash = id === 'stock' ? this.num(this.form.stock_frozen_cash)
          : id === 'cb' ? this.num(this.form.bond_frozen_cash)
          : null
        return {
          snapshot_date: this.form.snapshot_date || localDate(),
          total: acc ? this.num(this.form[acc.totalKey]) : 0,
          available_cash,
          frozen_cash,
        }
      },
      async saveAccountSnapshot(id) {
        const res = await fetch(`/api/account/${id}/snapshot`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.accountSnapshotPayload(id)),
        })
        if (!res.ok) throw new Error('保存账户失败')
        const saved = await res.json()
        this.applySummary(saved)
      },
      async saveAccount(strategy) {
        try {
          const src = strategy === 'cb' ? this.cbRows : this.stockRows
          const rows = src.filter(r => r.code).map(r => ({ code: r.code, name: r.name, shares: r.shares }))
          const positionDate = this.form.snapshot_date || localDate()

          // 持仓与账户金额必须同一事务写入，避免部分保存。
          if (this.loaded[strategy]) {
            const totalKey = strategy === 'cb' ? 'bond_total' : 'stock_total'
            this.form[totalKey] = this.accountTotal(strategy)
          }
          const account = this.accountSnapshotPayload(strategy)
          const res = await fetch(`/api/account/${strategy}/state`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ...account, snapshot_date: positionDate, positions: rows }),
          })
          if (!res.ok) {
            const error = await res.json().catch(() => null)
            throw new Error(error?.detail || '保存账户状态失败')
          }
          this.applySummary(await res.json())
          src.forEach(r => { r.isNew = false })

          // 标记已保存
          if (strategy === 'cb') { this.cbSaved = true; setTimeout(() => this.cbSaved = false, 2000) }
          else { this.stockSaved = true; setTimeout(() => this.stockSaved = false, 2000) }
        } catch (err) {
          console.error(err)
          alert(err.message || '保存账户状态失败')
        }
      },
    }
  }

  function tradingPage() {
    return {
      // T 日数据
      tDate: localDate(), marketTemperature: null,
      // 资金分配 + 订单
      plan: null, transferPlan: null, planError: '', loadingPlan: false,
      generationStage: '', componentErrors: { cb: '', stock: '' },
      funding: { snapshot_date: '', temperature: null, check_type: 'a_internal', new_contribution: 0, b_purchase_status: 'unchecked', b_purchase_limit: 0, b_purchase_checked_at: '', b_purchase_source: '' },
      sizingCb: false, sizingStock: false,
      // 排名
      running: { cb: false, stock: false },
      cbItems: [], stockItems: [],
      cbDates: [], stockDates: [],
      cbDate: '', stockDate: '',
      cbTradeDate: '', stockTradeDate: '',
      showCbRank: false, showStockRank: false,
      async init() {
        const summary = await fetch('/api/account/summary').then(r => r.json().catch(() => null))
        if (summary) {
          this.tDate = summary.context?.snapshot_date || this.tDate
          const context = summary.context || {}
          this.funding.snapshot_date = context.snapshot_date || this.tDate
          this.funding.temperature = context.temperature
          this.funding.check_type = context.check_type || 'a_internal'
          this.funding.new_contribution = context.new_contribution || 0
          this.funding.b_purchase_limit = context.b_purchase_limit || 0
          this.funding.b_purchase_checked_at = context.b_purchase_checked_at || ''
          this.funding.b_purchase_source = context.b_purchase_source || ''
          this.funding.b_purchase_status = this.inferBPurchaseStatus(context)
        }
        await this.refreshFullPlan(false)
        await this.refreshRankingState()
      },

      inferBPurchaseStatus(context) {
        const checked = Boolean(context.b_purchase_checked_at && context.b_purchase_source)
        if (!checked) return 'unchecked'
        return Number(context.b_purchase_limit) > 0 ? 'available' : 'unavailable'
      },
      needsContribution() {
        return this.funding.check_type === 'monthly_contribution'
      },
      needsBCheck() {
        return ['monthly_contribution', 'quarterly', 'b_recovery', 'ad_hoc'].includes(this.funding.check_type)
      },

      async loadTransferPlan(refreshTemperature = false) {
        const url = refreshTemperature ? '/api/plan/transfer?refresh_temperature=true' : '/api/plan/transfer'
        const res = await fetch(url)
        if (!res.ok) {
          return
        }
        this.transferPlan = await res.json()
        this.marketTemperature = this.transferPlan?.market_temperature || this.marketTemperature
        if (this.transferPlan?.plan_date) this.tDate = this.transferPlan.plan_date
      },

      async refreshFullPlan(refreshTemperature = false) {
        this.loadingPlan = true
        try {
          await this.loadPlan(refreshTemperature)
          if (this.plan) this.transferPlan = this.plan
        } finally {
          this.loadingPlan = false
        }
      },

      async saveFundingContext() {
        let temperature = Number(this.funding.temperature)
        if (!Number.isFinite(temperature)) {
          const response = await fetch('/api/plan/context')
          if (!response.ok) throw new Error('无法取得当前市场温度，暂不能保存本次计划条件')
          temperature = Number((await response.json()).market_temperature?.temperature)
        }

        const usesB = this.needsBCheck()
        const bStatus = usesB ? this.funding.b_purchase_status : 'unchecked'
        const checked = bStatus !== 'unchecked'
        const source = checked ? String(this.funding.b_purchase_source || '').trim() : ''
        const checkedAt = checked ? this.funding.b_purchase_checked_at : ''
        const limit = bStatus === 'available' ? Number(this.funding.b_purchase_limit) : 0
        if (checked && (!checkedAt || !source)) {
          throw new Error('已核验 B 申购状态必须填写核验时间和来源')
        }
        if (bStatus === 'available' && (!Number.isFinite(limit) || limit <= 0)) {
          throw new Error('B 可申购时必须填写大于 0 的实际单次额度')
        }

        const res = await fetch('/api/account/context', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            snapshot_date: this.funding.snapshot_date || this.tDate,
            temperature,
            check_type: this.funding.check_type,
            new_contribution: this.needsContribution() ? Number(this.funding.new_contribution) || 0 : 0,
            b_purchase_limit: limit,
            b_purchase_checked_at: checkedAt || null,
            b_purchase_source: source || null,
          }),
        })
        if (!res.ok) {
          const body = await res.json().catch(() => ({ detail: '保存本次计划条件失败' }))
          throw new Error(typeof body.detail === 'string' ? body.detail : body.detail?.message || '保存本次计划条件失败')
        }
      },

      async generateCompletePlan() {
        this.loadingPlan = true
        this.planError = ''
        this.componentErrors = { cb: '', stock: '' }
        try {
          this.generationStage = '保存计划条件'
          await this.saveFundingContext()
          this.generationStage = '检查账户与资金调拨'
          await this.loadPlan(false)
          if (!this.plan) throw new Error(this.planError || '账户或资金调拨输入尚未就绪')
          this.transferPlan = this.plan

          for (const strategy of ['cb', 'stock']) {
            try {
              this.generationStage = `准备${this.strategyLabel(strategy)}榜单`
              await this.ensureRanking(strategy)
            } catch (error) {
              this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}计划生成失败`
            }
          }

          for (const strategy of ['cb', 'stock']) {
            if (this.componentErrors[strategy]) continue
            try {
              this.generationStage = `计算${this.strategyLabel(strategy)}订单`
              await this.generateOrders(strategy)
            } catch (error) {
              this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}计划生成失败`
            }
          }

          this.generationStage = '汇总完整计划'
          await this.loadPlan(false)
          if (this.plan) this.transferPlan = this.plan
          await this.refreshRankingState()
        } catch (error) {
          this.planError = error.message || '完整计划生成失败'
        } finally {
          this.generationStage = ''
          this.loadingPlan = false
        }
      },

      async loadPlan(refreshTemperature = false, suppressDateMismatch = false) {
        this.planError = ''
        const url = refreshTemperature ? '/api/plan?refresh_temperature=true' : '/api/plan'
        const res = await fetch(url)
        if (!res.ok) {
          const body = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }))
          const detail = body.detail || {}
          this.plan = null
          this.marketTemperature = detail.market_temperature || this.marketTemperature
          if (detail.plan_date) {
            this.tDate = detail.plan_date
            this.funding.snapshot_date = this.tDate
          }
          if (suppressDateMismatch && detail.code === 'PLAN_INPUT_DATE_MISMATCH') {
            return
          }
          const lines = (detail.errors || []).map(e => `${e.message}: 更新时间 ${e.date || '无'}，输入窗口 ${e.expected}`)
          this.planError = [detail.message || String(detail || `计划生成失败 (${res.status})`), ...lines].join('\n')
          return
        }
        this.plan = await res.json()
        this.marketTemperature = this.plan?.market_temperature || null
        if (this.plan?.market_temperature?.updated_at) {
          this.tDate = this.plan.market_temperature.updated_at.slice(0, 10)
          this.funding.snapshot_date = this.tDate
        }
      },

      // ── 排名 ──
      async loadCb() {
        if (!this.cbDate) return
        const r = await fetch(`/api/rankings/cb/${this.cbDate}`).then(r => r.json())
        this.cbItems = r.items || []
        this.cbTradeDate = r.trade_date || ''
      },
      async loadStock() {
        if (!this.stockDate) return
        const r = await fetch(`/api/rankings/stock/${this.stockDate}`).then(r => r.json())
        this.stockItems = r.items || []
        this.stockTradeDate = r.trade_date || ''
      },
      async refreshRankingState() {
        const [cbD, stD] = await Promise.all([
          fetch('/api/rankings/cb/dates').then(r => r.json()),
          fetch('/api/rankings/stock/dates').then(r => r.json()),
        ])
        this.cbDates = cbD.sort().reverse(); this.cbDate = this.cbDates.includes(this.tDate) ? this.tDate : ''
        this.stockDates = stD.sort().reverse(); this.stockDate = this.stockDates.includes(this.tDate) ? this.tDate : ''
        if (this.cbDate) await this.loadCb()
        else { this.cbItems = []; this.cbTradeDate = '' }
        if (this.stockDate) await this.loadStock()
        else { this.stockItems = []; this.stockTradeDate = '' }
      },
      async generateRanking(strategy) {
        this.running[strategy] = true
        try {
          const res = await fetch(`/api/rankings/${strategy}/run`, { method: 'POST' })
          if (!res.ok) {
            const body = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }))
            const msg = typeof body.detail === 'object' ? body.detail.message : String(body.detail || `请求失败 (${res.status})`)
            throw new Error(msg)
          }
          const data = await res.json()
          if (data.data_date !== this.tDate) {
            throw new Error(`生成的${this.strategyLabel(strategy)}榜单日期为 ${data.data_date}，与计划基准日 ${this.tDate} 不一致`)
          }
          if (strategy === 'cb') {
            this.cbDate = data.data_date
            this.cbItems = data.items || []
            this.cbTradeDate = data.trade_date || ''
          } else {
            this.stockDate = data.data_date
            this.stockItems = data.items || []
            this.stockTradeDate = data.trade_date || ''
          }
        } finally {
          this.running[strategy] = false
        }
      },
      async ensureRanking(strategy) {
        const missing = (this.plan?.trade_errors || []).some(item => item.input === strategy)
        if (!missing) return
        await this.generateRanking(strategy)
        await this.loadPlan(false)
        if (!this.plan) throw new Error(this.planError || `${this.strategyLabel(strategy)}榜单生成后计划仍不可用`)
      },
      async runStrategy(strategy) {
        this.componentErrors[strategy] = ''
        try {
          await this.generateRanking(strategy)
          await this.loadPlan(false)
          await this.refreshRankingState()
        } catch (error) {
          this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}榜单生成失败`
        }
      },
      async exportMd(strategy) {
        const date = strategy === 'cb' ? this.cbDate : this.stockDate
        const r = await fetch(`/api/rankings/${strategy}/${date}/export`)
        const text = await r.text()
        const blob = new Blob([text], {type: 'text/plain'})
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = `${strategy}_top20_${date}.md`
        a.click()
      },

      // ── 订单 ──
      fmtMoney(v) {
        return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      },
      executionDate() {
        return this.plan?.stock?.trade_date || this.plan?.cb?.trade_date || ''
      },
      temperatureText() {
        const t = (this.plan?.market_temperature || this.marketTemperature)?.temperature
        return t == null ? '-' : `${Number(t).toFixed(0)}°`
      },
      temperatureLabel() {
        return (this.plan?.market_temperature || this.marketTemperature)?.label || ''
      },
      temperatureUpdatedAt() {
        const raw = (this.plan?.market_temperature || this.marketTemperature)?.updated_at
        if (!raw) return ''
        return raw.replace('T', ' ')
      },
      strategyLabel(strategy) {
        return strategy === 'cb' ? '转债' : '股票'
      },
      statusClass(state) {
        if (state === 'ready') return 'bg-green-50 border-green-100 text-green-700'
        if (state === 'failed' || state === 'blocked') return 'bg-red-50 border-red-100 text-red-700'
        if (state === 'missing') return 'bg-amber-50 border-amber-100 text-amber-700'
        return 'bg-gray-50 border-gray-100 text-gray-500'
      },
      strategyStatus(strategy) {
        if (this.componentErrors[strategy]) return { state: 'failed', text: '生成失败' }
        const section = this.plan?.[strategy]
        if (section?.orders?.length) return { state: 'ready', text: '订单已生成' }
        const items = strategy === 'cb' ? this.cbItems : this.stockItems
        if (items.length) return { state: 'missing', text: '榜单已就绪，待生成订单' }
        const missing = (this.plan?.trade_errors || []).some(item => item.input === strategy)
        if (missing) return { state: 'missing', text: '缺少榜单' }
        return { state: 'waiting', text: this.plan ? '暂无订单' : '等待生成' }
      },
      transferStatusText() {
        if (!this.plan?.fund_transfer) return '等待生成'
        const internal = this.plan.fund_transfer.a_internal
        if (internal?.status === 'not_requested') return '主动组合内部资金调拨尚未检查'
        if (internal?.status === 'paused') return internal.pause_reason || '主动组合内部资金调拨等待必要事实'
        return this.transferSteps().length ? `已生成 ${this.transferSteps().length} 步` : '已完整检查，本次无需资金调拨'
      },
      readinessItems() {
        const transferReady = Boolean(this.plan?.fund_transfer)
        const cb = this.strategyStatus('cb')
        const stock = this.strategyStatus('stock')
        return [
          { label: '账户事实', state: this.plan?.account ? 'ready' : this.planError ? 'blocked' : 'waiting', text: this.plan?.account ? '已就绪' : '等待校验' },
          { label: '资金调拨', state: transferReady ? 'ready' : this.planError ? 'blocked' : 'waiting', text: this.transferStatusText() },
          { label: '转债计划', state: cb.state, text: cb.text },
          { label: '股票计划', state: stock.state, text: stock.text },
        ]
      },
      groupClass(action) {
        if (action === 'BUY' || action === 'ADD') return 'text-green-600'
        if (action === 'SELL') return 'text-red-500'
        if (action === 'TRIM') return 'text-orange-500'
        return 'text-gray-500'
      },
      adjustedCash(strategy) {
        const cf = strategy === 'cb' ? 'bond_cash' : 'stock_cash'
        const dk = strategy === 'cb' ? 'bond' : 'stock'
        const base = this.plan?.account?.[cf.replace('_cash', '_available_cash')] ?? this.plan?.account?.[cf] ?? 0
        const delta = (this.plan?.transfer_deltas || this.transferPlan?.transfer_deltas)?.[dk] || 0
        // 正delta(入金)当日可用, 负delta(转出)必须预留
        return Math.round(base + delta)
      },
      transferSteps() {
        return this.plan?.transfer_steps?.length
          ? this.plan.transfer_steps
          : (this.transferPlan?.transfer_steps || [])
      },
      async generateOrders(strategy) {
        if (!this.plan?.account) throw new Error('请先在账户页补齐账户事实')
        const response = await fetch(`/api/plan/${strategy}/size-orders`, { method: 'POST' })
        if (!response.ok) {
          const body = await response.json().catch(() => ({ detail: '订单生成失败' }))
          const detail = body.detail || {}
          throw new Error(typeof detail === 'string' ? detail : detail.message || `${this.strategyLabel(strategy)}订单生成失败`)
        }
        await this.loadPlan(false)
        if (!this.plan) throw new Error(this.planError || `${this.strategyLabel(strategy)}订单生成后计划不可用`)
      },
      async sizeOrders(strategy) {
        const key = strategy === 'cb' ? 'sizingCb' : 'sizingStock'
        this.componentErrors[strategy] = ''
        this[key] = true
        try {
          await this.generateOrders(strategy)
        } catch (error) {
          this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}订单生成失败`
        } finally { this[key] = false }
      },
      cbGroups() {
        const orders = this.plan?.cb?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && r.shares !== 0)
        })).filter(g => g.items.length)
      },
      stockGroups() {
        const orders = this.plan?.stock?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && r.shares !== 0)
        })).filter(g => g.items.length)
      },
    }
  }
</script>
