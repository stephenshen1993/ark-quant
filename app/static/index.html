<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ark-quant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen antialiased">

<!-- 侧边导航 -->
<nav class="w-40 bg-white border-r border-gray-200 flex flex-col pt-6 px-3 gap-1 shrink-0">
  <span class="text-xs text-gray-400 font-medium px-2 mb-2">ark-quant</span>
  <template x-data x-for="item in [
    {id:'account', label:'账户', icon:'📊'},
    {id:'trading', label:'交易', icon:'📈'}
  ]">
    <button @click="$dispatch('nav', item.id)"
      :class="$store.page === item.id
        ? 'bg-gray-100 text-gray-900 font-medium'
        : 'text-gray-500 hover:bg-gray-50'"
      class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-left w-full">
      <span x-text="item.icon"></span>
      <span x-text="item.label"></span>
    </button>
  </template>
</nav>

<!-- 主内容 -->
<main class="flex-1 overflow-auto p-8" x-data @nav.window="$store.page = $event.detail">

  <!-- 账户总览 -->
  <div x-show="$store.page === 'account'" x-data="accountPage()" x-init="load()">

    <div class="max-w-7xl">
      <!-- 标题栏 -->
      <div class="flex justify-between items-center mb-5">
        <div>
          <h1 class="text-xl font-semibold tracking-normal">账户</h1>
        </div>
      </div>

      <!-- 总资产 -->
      <section class="bg-white border border-gray-100 rounded-xl p-6 mb-5 shadow-sm shadow-gray-100/40">
        <div class="flex items-baseline gap-3">
          <span class="text-sm text-gray-400">总资产</span>
          <span class="text-4xl font-semibold tracking-normal tabular-nums" x-text="fmtMoney(totalAssets())"></span>
        </div>
        <div x-show="!snap" class="text-sm text-gray-400 mt-2">暂无账户数据。</div>
      </section>

      <!-- 账户列表 -->
      <table class="w-full table-fixed bg-white border border-gray-100 rounded-xl shadow-sm shadow-gray-100/40">
        <template x-for="acc in accounts" :key="acc.id">
          <tbody>
            <tr @click="acc.posType ? toggleExpand(acc.id) : null"
              :class="acc.posType ? 'cursor-pointer hover:bg-gray-50' : ''"
              class="border-b border-gray-50 last:border-b-0">
              <td class="pl-5 py-3.5" style="width:32px"><div :style="'background:' + acc.color" class="w-2.5 h-2.5 rounded-full"></div></td>
              <td class="py-3.5 pr-4"><span class="text-sm font-medium" x-text="acc.label"></span><span class="text-xs text-gray-400 ml-2" x-text="acc.sub"></span></td>
              <td class="py-3.5 pr-4 text-right"><span x-show="acc.posType" class="text-sm font-semibold tabular-nums" x-text="fmtMoney(num(form[acc.totalKey]))"></span><span x-show="!acc.posType"><span x-show="editingSimple === acc.id" class="flex items-baseline gap-1 justify-end"><span class="text-sm text-gray-400">¥</span><input type="text" inputmode="decimal" x-model="form[acc.totalKey]" @blur="saveSimpleAccount(acc.id)" @keyup.enter="$el.blur()" x-init="$el.focus()" class="text-sm font-semibold tabular-nums bg-transparent text-right outline-none border-b border-gray-200 w-28" placeholder="0"></span><span x-show="editingSimple !== acc.id" @click.stop="editingSimple = acc.id" class="text-sm font-semibold tabular-nums cursor-pointer" x-text="fmtMoney(num(form[acc.totalKey]))"></span></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400 tabular-nums"><span x-text="acctPct(acc)"></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400"><span x-text="accUpdateDate(acc)"></span></td>
              <td class="py-3.5 pr-5 text-center" style="width:28px"><span x-show="acc.posType" class="text-gray-300 text-sm" x-text="expanded === acc.id ? '▾' : '▸'"></span></td>
            </tr>
            <tr x-show="expanded === 'stock' && acc.id === 'stock'" class="border-b border-gray-50">
              <td colspan="6" class="bg-gray-50/30 px-5 py-4">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-gray-400">现金 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.stock_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
              </div>
              <table class="w-full table-fixed text-sm"><thead><tr class="text-xs text-gray-400 border-b border-gray-200"><th class="text-left font-normal py-1.5">代码</th><th class="text-left font-normal py-1.5">名称</th><th class="text-right font-normal py-1.5">股数</th><th class="text-right font-normal py-1.5">现价</th><th class="text-right font-normal py-1.5">市值</th><th class="text-right font-normal py-1.5">占比</th><th style="width:24px"></th></tr></thead>
              <tbody><template x-for="row in stockRows" :key="row._id"><tr class="border-b border-gray-100"><td class="py-1.5"><template x-if="row.isNew"><input type="text" x-model="row.code" @change="autofill('stock', row)" placeholder="代码" style="border:none;border-bottom:1px solid #d1d5db;background:transparent;outline:none;padding:1px 0;font-size:12px;width:5em;"></template><span x-show="!row.isNew" class="text-xs text-gray-500" x-text="row.code"></span></td><td class="py-1.5 text-gray-700 font-medium text-xs" x-text="row.name || '—'"></td><td class="py-1.5 text-right"><input type="number" min="0" step="100" x-model.number="row.shares" @input.debounce.600ms="scheduleSortRows('stock')" style="border:none;border-bottom:1px solid #e5e7eb;background:transparent;outline:none;padding:1px 0;text-align:right;font-size:12px;width:5em;"></td><td class="py-1.5 text-right text-xs text-gray-500" x-text="rowPrice('stock', row.code)?.toFixed(2) ?? '-'"></td><td class="py-1.5 text-right text-xs text-gray-800 tabular-nums" x-text="rowValue('stock', row) != null ? fmtMoney(rowValue('stock', row)) : '-'"></td><td class="py-1.5 text-right text-xs text-gray-400" x-text="rowWeight('stock', row) != null ? (rowWeight('stock', row)*100).toFixed(1)+'%' : '-'"></td><td class="py-1.5 text-center"><button @click="removeRow('stock', row)" class="text-gray-300 hover:text-red-400 text-xs">✕</button></td></tr></template></tbody></table>
              <div x-show="stockRows.length === 0" class="text-xs text-gray-400 py-2">暂无持仓</div>
              <div class="flex items-center gap-3 mt-3"><button @click="addRow('stock')" class="text-xs text-gray-400 hover:text-gray-600">＋ 添加行</button><button @click="saveAccount('stock')" class="text-xs px-3 py-1 bg-gray-800 text-white rounded-md hover:bg-gray-700">保存</button><span x-show="stockSaved" class="text-xs text-green-600">已保存</span></div>
              </td>
            </tr>
            <tr x-show="expanded === 'cb' && acc.id === 'cb'" class="border-b border-gray-50">
              <td colspan="6" class="bg-gray-50/30 px-5 py-4">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-gray-400">现金 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.bond_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
              </div>
              <table class="w-full table-fixed text-sm"><thead><tr class="text-xs text-gray-400 border-b border-gray-200"><th class="text-left font-normal py-1.5">代码</th><th class="text-left font-normal py-1.5">名称</th><th class="text-right font-normal py-1.5">张数</th><th class="text-right font-normal py-1.5">现价</th><th class="text-right font-normal py-1.5">市值</th><th class="text-right font-normal py-1.5">占比</th><th style="width:24px"></th></tr></thead>
              <tbody><template x-for="row in cbRows" :key="row._id"><tr class="border-b border-gray-100"><td class="py-1.5"><template x-if="row.isNew"><input type="text" x-model="row.code" @change="autofill('cb', row)" placeholder="代码" style="border:none;border-bottom:1px solid #d1d5db;background:transparent;outline:none;padding:1px 0;font-size:12px;width:5em;"></template><span x-show="!row.isNew" class="text-xs text-gray-500" x-text="row.code"></span></td><td class="py-1.5 text-gray-700 font-medium text-xs" x-text="row.name || '—'"></td><td class="py-1.5 text-right"><input type="number" min="0" step="10" x-model.number="row.shares" @input.debounce.600ms="scheduleSortRows('cb')" style="border:none;border-bottom:1px solid #e5e7eb;background:transparent;outline:none;padding:1px 0;text-align:right;font-size:12px;width:5em;"></td><td class="py-1.5 text-right text-xs text-gray-500" x-text="rowPrice('cb', row.code)?.toFixed(2) ?? '-'"></td><td class="py-1.5 text-right text-xs text-gray-800 tabular-nums" x-text="rowValue('cb', row) != null ? fmtMoney(rowValue('cb', row)) : '-'"></td><td class="py-1.5 text-right text-xs text-gray-400" x-text="rowWeight('cb', row) != null ? (rowWeight('cb', row)*100).toFixed(1)+'%' : '-'"></td><td class="py-1.5 text-center"><button @click="removeRow('cb', row)" class="text-gray-300 hover:text-red-400 text-xs">✕</button></td></tr></template></tbody></table>
              <div x-show="cbRows.length === 0" class="text-xs text-gray-400 py-2">暂无持仓</div>
              <div class="flex items-center gap-3 mt-3"><button @click="addRow('cb')" class="text-xs text-gray-400 hover:text-gray-600">＋ 添加行</button><button @click="saveAccount('cb')" class="text-xs px-3 py-1 bg-gray-800 text-white rounded-md hover:bg-gray-700">保存</button><span x-show="cbSaved" class="text-xs text-green-600">已保存</span></div>
              </td>
            </tr>
          </tbody>
        </template>
      </table>
    </div>
  </div>

<!-- 交易 -->
  <div x-show="$store.page === 'trading'" x-data="tradingPage()" x-init="init()" class="max-w-7xl">
    <!-- T 日收盘数据 -->
    <div class="flex items-center gap-4 mb-5 p-4 bg-white border border-gray-100 rounded-xl shadow-sm">
      <h1 class="text-xl font-semibold">交易</h1>
      <span x-show="executionDate()" class="text-xs text-green-600 bg-green-50 px-3 py-1.5 rounded-full"
        x-text="'适用 ' + executionDate() + ' 开盘执行'"></span>
      <div class="flex items-center gap-3 ml-auto">
        <label class="text-xs text-gray-400 flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">日期
          <input type="date" x-model="tDate" class="text-xs text-gray-600 bg-transparent outline-none w-28">
        </label>
        <label class="text-xs text-gray-400 flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">温度
          <input type="number" x-model.number="temperature" placeholder="45" class="text-xs text-gray-600 bg-transparent outline-none w-10 text-center">
        </label>
        <span x-show="tDaySaved" class="text-xs text-green-600">已保存</span>
        <button @click="saveTDay()" class="px-3 py-1.5 bg-gray-900 text-white text-xs rounded-lg hover:bg-gray-700">保存</button>
      </div>
    </div>
    <!-- 资产再平衡 -->
    <div class="bg-white border border-gray-100 rounded-xl p-5 mb-4 shadow-sm shadow-gray-100/40" x-show="plan?.transfer_steps?.length">
      <div class="text-sm font-semibold mb-3">① 资金调拨</div>
      <template x-for="(step, i) in plan?.transfer_steps || []">
        <div class="flex gap-3 text-sm text-gray-700 py-2 border-b border-gray-50 last:border-0">
          <span class="text-xs w-5 h-5 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center shrink-0" x-text="i+1"></span>
          <span x-text="step"></span>
        </div>
      </template>
    </div>
    <!-- ② 转债 -->
    <div class="bg-white border border-gray-100 rounded-xl p-5 mb-4 shadow-sm shadow-gray-100/40">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold">② 转债调仓
          <span class="text-xs text-gray-400 font-normal ml-2" x-text="plan?.cb?.data_date ? '基于 ' + plan?.cb?.data_date + ' 收盘' : ''"></span>
        </div>
        <div class="flex gap-2 items-center">
          <button @click="exportMd('cb')" class="px-2 py-1 border border-gray-200 bg-white text-xs rounded hover:bg-gray-50" x-show="cbItems.length">导出</button>
          <button @click="runStrategy('cb')" :disabled="running"
            class="px-3 py-1.5 text-xs rounded-lg text-white"
            :class="running ? 'bg-gray-400 cursor-not-allowed' : 'bg-gray-800 hover:bg-gray-700'">
            <span x-show="!running">运行策略</span>
            <span x-show="running" class="flex items-center gap-1">⋯ 运行中</span>
          </button>
        </div>
      </div>
      <div x-show="error" class="bg-red-50 border border-red-200 rounded-xl p-3 mb-3 text-sm text-red-700" x-text="error"></div>
      <!-- 排名表 -->
      <div x-show="cbItems.length && !plan?.cb?.orders?.length" class="mb-4">
        <div class="text-xs text-gray-400 mb-2" x-text="cbTradeDate ? '基于 ' + cbDate + ' 收盘 · 适用 ' + cbTradeDate + ' 开盘执行' : ''"></div>
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-xs text-gray-400"><tr>
            <th class="text-center px-3 py-2 w-10 font-normal">#</th><th class="text-left px-2 py-2 font-normal">代码</th><th class="text-left px-2 py-2 font-normal">名称</th><th class="text-right px-2 py-2 font-normal">价格</th><th class="text-right px-2 py-2 font-normal">溢价率</th><th class="text-right px-2 py-2 font-normal">双低值</th><th class="text-right px-3 py-2 font-normal">评分</th>
          </tr></thead>
          <tbody>
            <template x-for="r in cbItems" :key="r.bond_code">
              <tr class="border-t border-gray-50"><td class="text-center px-3 py-1.5 text-gray-400 text-xs" x-text="r.rank"></td><td class="px-2 py-1.5 text-gray-500 tabular-nums" x-text="r.bond_code"></td><td class="px-2 py-1.5 font-medium" x-text="r.bond_name"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.cb_price?.toFixed(2)"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.premium_rate?.toFixed(2) + '%'"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.double_low?.toFixed(2)"></td><td class="px-3 py-1.5 text-right tabular-nums text-gray-800" x-text="r.score?.toFixed(3)"></td></tr>
            </template>
          </tbody>
        </table>
      </div>
      <!-- 生成订单（有排名但无订单时） -->
      <div x-show="cbItems.length && !plan?.cb?.orders?.length" class="flex items-center gap-2 mb-3 text-sm p-3 bg-gray-50 rounded-lg">
        <span class="text-gray-400 text-xs">可用现金（含调拨） <span class="text-gray-600 font-medium" x-text="fmtMoney(adjustedCash('cb'))"></span>（卖出回款自动计入）</span>
        <button @click="sizeOrders('cb')" :disabled="sizingCb"
          class="ml-auto px-3 py-1.5 bg-blue-500 text-white rounded text-xs font-medium hover:bg-blue-600 disabled:opacity-50"
          x-text="sizingCb ? '计算中…' : '生成订单'"></button>
      </div>
      <!-- 订单卡片（有订单时） -->
      <template x-if="plan?.cb?.orders?.length">
        <div>
          <button @click="showCbRank = !showCbRank" class="text-xs text-gray-400 hover:text-gray-600 mb-2" x-text="showCbRank ? '收起排名' : '查看排名'"></button>
          <div x-show="showCbRank" class="mb-4">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-xs text-gray-400"><tr><th class="text-center px-3 py-2 w-10 font-normal">#</th><th class="text-left px-2 py-2 font-normal">代码</th><th class="text-left px-2 py-2 font-normal">名称</th><th class="text-right px-2 py-2 font-normal">价格</th><th class="text-right px-2 py-2 font-normal">溢价率</th><th class="text-right px-2 py-2 font-normal">双低值</th><th class="text-right px-3 py-2 font-normal">评分</th></tr></thead>
              <tbody><template x-for="r in cbItems" :key="r.bond_code"><tr class="border-t border-gray-50"><td class="text-center px-3 py-1.5 text-gray-400 text-xs" x-text="r.rank"></td><td class="px-2 py-1.5 text-gray-500 tabular-nums" x-text="r.bond_code"></td><td class="px-2 py-1.5 font-medium" x-text="r.bond_name"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.cb_price?.toFixed(2)"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.premium_rate?.toFixed(2) + '%'"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.double_low?.toFixed(2)"></td><td class="px-3 py-1.5 text-right tabular-nums text-gray-800" x-text="r.score?.toFixed(3)"></td></tr></template></tbody>
            </table>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="group in cbGroups()" :key="group.label">
              <div class="bg-gray-50 rounded-lg p-3">
                <div class="text-xs font-medium mb-2" :class="groupClass(group.action)" x-text="group.label + ' (' + group.items.length + ')'"></div>
                <table class="w-full text-sm">
                  <template x-for="r in group.items" :key="r.bond_code">
                    <tr class="border-b border-gray-50 last:border-0"><td class="py-1.5 pr-3 text-gray-400" x-text="r.bond_code"></td><td class="py-1.5 pr-4 font-medium" x-text="r.bond_name"></td><td class="py-1.5 pr-2 text-right whitespace-nowrap" :class="r.shares>0?'text-green-600':'text-red-500'" x-text="(r.shares>0?'+':'')+r.shares+'张'"></td><td class="py-1.5 text-right text-gray-800 whitespace-nowrap tabular-nums" x-text="fmtMoney(Math.abs(r.amount || 0))"></td></tr>
                  </template>
                </table>
              </div>
            </template>
          </div>
        </div>
      </template>
      <!-- 无排名提示 -->
      <div x-show="!cbItems.length && !running" class="text-sm text-gray-400 py-4">暂无排名，点击「运行策略」生成。</div>
    </div>
    <!-- ③ 股票 -->
    <div class="bg-white border border-gray-100 rounded-xl p-5 shadow-sm shadow-gray-100/40">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold">③ 股票调仓
          <span class="text-xs text-gray-400 font-normal ml-2" x-text="plan?.stock?.data_date ? '基于 ' + plan?.stock?.data_date + ' 收盘' : ''"></span>
        </div>
        <div class="flex gap-2 items-center">
          <button @click="exportMd('stock')" class="px-2 py-1 border border-gray-200 bg-white text-xs rounded hover:bg-gray-50" x-show="stockItems.length">导出</button>
          <button @click="runStrategy('stock')" :disabled="running"
            class="px-3 py-1.5 text-xs rounded-lg text-white"
            :class="running ? 'bg-gray-400 cursor-not-allowed' : 'bg-gray-800 hover:bg-gray-700'">
            <span x-show="!running">运行策略</span>
            <span x-show="running" class="flex items-center gap-1">⋯ 运行中</span>
          </button>
        </div>
      </div>
      <div x-show="error" class="bg-red-50 border border-red-200 rounded-xl p-3 mb-3 text-sm text-red-700" x-text="error"></div>
      <!-- 排名表（有排名但无订单时展开） -->
      <div x-show="stockItems.length && !plan?.stock?.orders?.length" class="mb-4">
        <div class="text-xs text-gray-400 mb-2" x-text="stockTradeDate ? '基于 ' + stockDate + ' 收盘 · 适用 ' + stockTradeDate + ' 开盘执行' : ''"></div>
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-xs text-gray-400"><tr>
            <th class="text-center px-3 py-2 w-10 font-normal">#</th><th class="text-left px-2 py-2 font-normal">代码</th><th class="text-left px-2 py-2 font-normal">名称</th><th class="text-right px-2 py-2 font-normal">总市值(亿)</th><th class="text-right px-2 py-2 font-normal">PE</th><th class="text-right px-3 py-2 font-normal">扣非ROE</th>
          </tr></thead>
          <tbody>
            <template x-for="r in stockItems" :key="r.stock_code">
              <tr class="border-t border-gray-50"><td class="text-center px-3 py-1.5 text-gray-400 text-xs" x-text="r.rank"></td><td class="px-2 py-1.5 text-gray-500 tabular-nums" x-text="r.stock_code"></td><td class="px-2 py-1.5 font-medium" x-text="r.stock_name"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.market_cap?.toFixed(2)"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.pe_ttm?.toFixed(2)"></td><td class="px-3 py-1.5 text-right tabular-nums text-gray-800" x-text="r.roe_ex?.toFixed(2) + '%'"></td></tr>
            </template>
          </tbody>
        </table>
      </div>
      <!-- 生成订单（有排名但无订单时） -->
      <div x-show="stockItems.length && !plan?.stock?.orders?.length" class="flex items-center gap-2 mb-3 text-sm p-3 bg-gray-50 rounded-lg">
        <span class="text-gray-400 text-xs">可用现金（含调拨） <span class="text-gray-600 font-medium" x-text="fmtMoney(adjustedCash('stock'))"></span>（卖出回款自动计入）</span>
        <button @click="sizeOrders('stock')" :disabled="sizingStock"
          class="ml-auto px-3 py-1.5 bg-blue-500 text-white rounded text-xs font-medium hover:bg-blue-600 disabled:opacity-50"
          x-text="sizingStock ? '计算中…' : '生成订单'"></button>
      </div>
      <!-- 订单卡片（有订单时） -->
      <template x-if="plan?.stock?.orders?.length">
        <div>
          <button @click="showStockRank = !showStockRank" class="text-xs text-gray-400 hover:text-gray-600 mb-2" x-text="showStockRank ? '收起排名' : '查看排名'"></button>
          <div x-show="showStockRank" class="mb-4">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-xs text-gray-400"><tr><th class="text-center px-3 py-2 w-10 font-normal">#</th><th class="text-left px-2 py-2 font-normal">代码</th><th class="text-left px-2 py-2 font-normal">名称</th><th class="text-right px-2 py-2 font-normal">总市值(亿)</th><th class="text-right px-2 py-2 font-normal">PE</th><th class="text-right px-3 py-2 font-normal">扣非ROE</th></tr></thead>
              <tbody><template x-for="r in stockItems" :key="r.stock_code"><tr class="border-t border-gray-50"><td class="text-center px-3 py-1.5 text-gray-400 text-xs" x-text="r.rank"></td><td class="px-2 py-1.5 text-gray-500 tabular-nums" x-text="r.stock_code"></td><td class="px-2 py-1.5 font-medium" x-text="r.stock_name"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.market_cap?.toFixed(2)"></td><td class="px-2 py-1.5 text-right tabular-nums" x-text="r.pe_ttm?.toFixed(2)"></td><td class="px-3 py-1.5 text-right tabular-nums text-gray-800" x-text="r.roe_ex?.toFixed(2) + '%'"></td></tr></template></tbody>
            </table>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="group in stockGroups()" :key="group.label">
              <div class="bg-gray-50 rounded-lg p-3">
                <div class="text-xs font-medium mb-2" :class="groupClass(group.action)" x-text="group.label + ' (' + group.items.length + ')'"></div>
                <table class="w-full text-sm">
                  <template x-for="r in group.items" :key="r.stock_code">
                    <tr class="border-b border-gray-50 last:border-0"><td class="py-1.5 pr-3 text-gray-400" x-text="r.stock_code"></td><td class="py-1.5 pr-4 font-medium" x-text="r.stock_name"></td><td class="py-1.5 pr-2 text-right whitespace-nowrap" :class="r.shares>0?'text-green-600':r.shares<0?'text-red-500':'text-gray-400'" x-text="(r.shares>0?'+':'')+r.shares+'股'"></td><td class="py-1.5 text-right text-gray-800 whitespace-nowrap tabular-nums" x-text="r.amount ? fmtMoney(Math.abs(r.amount)) : ''"></td></tr>
                  </template>
                </table>
              </div>
            </template>
          </div>
        </div>
      </template>
      <!-- 无排名提示 -->
      <div x-show="!stockItems.length && !running" class="text-sm text-gray-400 py-4">暂无排名，点击「运行策略」生成。</div>
    </div>
  </div>



</main>

<script>
  // Alpine store for active page
  document.addEventListener('alpine:init', () => {
    Alpine.store('page', 'account')
  })

  // 账户总览（含持仓）
  function accountPage() {
    return {
      snap: null,
      expanded: null, editingSimple: null,
      cbSaved: false, stockSaved: false,
      cbRows: [], stockRows: [],
      prices: { stock: {}, cb: {} },   // code -> {name, price}
      loaded: { stock: false, cb: false },
      _uid: 0,
      _sortTimers: {},
      accounts: [
        { id: 'stock',    label: '广发账户', sub: '股票仓位',   color: '#8b5cf6', totalKey: 'stock_total',     posType: 'stock' },
        { id: 'cb',       label: '华泰账户', sub: '转债仓位',   color: '#14b8a6', totalKey: 'bond_total',      posType: 'cb'    },
        { id: 'changqian',label: '长钱账户', sub: '国内基金',   color: '#f59e0b', totalKey: 'changqian_total', posType: null    },
        { id: 'overseas', label: '海外长钱', sub: '海外基金',   color: '#60a5fa', totalKey: 'overseas_total',  posType: null    },
        { id: 'cash',     label: '资金账户', sub: '现金仓位',   color: '#9ca3af', totalKey: 'cash_pool',       posType: null    },
      ],
      form: {
        snapshot_date: new Date().toISOString().slice(0, 10),
        temperature: null, stock_total: null, stock_cash: null,
        bond_total: null, bond_cash: null, changqian_total: null,
        cash_pool: null, overseas_total: null,
        _stock_updated: '', _cb_updated: '',
      },
      async load() {
        const [snap, cb, stock] = await Promise.all([
          fetch('/api/account/latest').then(r => r.json()),
          fetch('/api/positions/cb').then(r => r.json()),
          fetch('/api/positions/stock').then(r => r.json()),
        ])
        this.snap = snap
        if (snap) Object.assign(this.form, snap)
        this.cbRows = cb.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        this.stockRows = stock.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        // per-account 更新日期
        this.form._stock_updated = stock.length > 0 ? stock[0].position_date : (snap?.snapshot_date || '')
        this.form._cb_updated = cb.length > 0 ? cb[0].position_date : (snap?.snapshot_date || '')
        // 自动加载行情
        await Promise.all([this.loadQuotes('stock'), this.loadQuotes('cb')])
      },
      addRow(strategy) {
        const row = { code: '', name: '', shares: 0, _id: ++this._uid, isNew: true }
        ;(strategy === 'cb' ? this.cbRows : this.stockRows).push(row)
      },
      removeRow(strategy, row) {
        const rows = strategy === 'cb' ? this.cbRows : this.stockRows
        const i = rows.indexOf(row)
        if (i >= 0) rows.splice(i, 1)
      },
      fmtMoney(v) { return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
      num(v) { return Number.isFinite(Number(v)) ? Number(v) : 0 },
      totalAssets() {
        const f = this.form
        return this.num(f.stock_total) + this.num(f.bond_total) + this.num(f.changqian_total) + this.num(f.cash_pool) + this.num(f.overseas_total)
      },
      async loadQuotes(strategy) {
        const q = await fetch(`/api/positions/${strategy}/quotes`).then(r => r.json())
        const map = {}
        ;(q.items || []).forEach(it => { map[it.code] = { name: it.name, price: it.price } })
        this.prices[strategy] = map
        this.loaded[strategy] = true
        this.sortRowsByValue(strategy)
      },
      async autofill(strategy, row) {
        const code = String(row.code || '').trim()
        if (!code) return
        const q = await fetch(`/api/positions/${strategy}/quote?code=${code}`).then(r => r.json())
        if (q && q.price != null) {
          this.prices[strategy] = { ...this.prices[strategy], [String(code).padStart(6, '0')]: { name: q.name, price: q.price } }
          if (q.name) row.name = q.name
          this.scheduleSortRows(strategy)
        }
      },
      rowPrice(strategy, code) {
        return this.prices[strategy][String(code || '').padStart(6, '0')]?.price ?? null
      },
      rowValue(strategy, row) {
        const p = this.rowPrice(strategy, row.code)
        return p != null ? p * (row.shares || 0) : null
      },
      holdingsValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        return rows.reduce((s, r) => s + (this.rowValue(strategy, r) || 0), 0)
      },
      rowWeight(strategy, row) {
        const total = this.holdingsValue(strategy)
        const v = this.rowValue(strategy, row)
        return (total && v != null) ? v / total : null
      },
      accountTotal(strategy) {
        const cash = strategy === 'stock' ? this.form.stock_cash : this.form.bond_cash
        return this.holdingsValue(strategy) + this.num(cash)
      },
      sortRowsByValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        rows.sort((a, b) => (this.rowValue(strategy, b) || 0) - (this.rowValue(strategy, a) || 0))
      },
      scheduleSortRows(strategy) {
        clearTimeout(this._sortTimers[strategy])
        this._sortTimers[strategy] = setTimeout(() => this.sortRowsByValue(strategy), 250)
      },
      toggleExpand(id) { this.expanded = this.expanded === id ? null : id },
      acctPct(acc) {
        const total = this.totalAssets()
        return total > 0 ? (this.num(this.form[acc.totalKey]) / total * 100).toFixed(1) + '%' : '0%'
      },
      accUpdateDate(acc) {
        if (acc.posType) {
          const d = this.form['_' + acc.id + '_updated'] || ''
          return d ? '更新于 ' + d.slice(0, 10) : ''
        }
        return this.snap?.snapshot_date ? '更新于 ' + this.snap.snapshot_date.slice(0, 10) : ''
      },
      async saveSimpleAccount(id) {
        this.editingSimple = null
        await this.saveSnapshot({ reload: false })
      },
      snapshotPayload() {
        return {
          snapshot_date: this.form.snapshot_date || new Date().toISOString().slice(0, 10),
          temperature: this.num(this.form.temperature),
          stock_total: this.num(this.form.stock_total),
          stock_cash: this.num(this.form.stock_cash),
          bond_total: this.num(this.form.bond_total),
          bond_cash: this.num(this.form.bond_cash),
          changqian_total: this.num(this.form.changqian_total),
          cash_pool: this.num(this.form.cash_pool),
          overseas_total: this.num(this.form.overseas_total),
        }
      },
      async saveSnapshot(options = {}) {
        const reload = options.reload !== false
        // 总资产 = 持仓资产(实时) + 现金；仅在已拉取报价时回写，避免覆盖成空值
        if (this.loaded.stock) this.form.stock_total = this.accountTotal('stock')
        if (this.loaded.cb)    this.form.bond_total  = this.accountTotal('cb')
        const payload = this.snapshotPayload()
        const res = await fetch('/api/account/snapshot', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        })
        if (!res.ok) throw new Error('保存账户失败')
        if (reload) {
          this.snap = payload
          Object.assign(this.form, payload)
          await this.load()
        } else {
          this.snap = payload
        }
      },
      async saveAccount(strategy) {
        // 1. 保存持仓
        const src = strategy === 'cb' ? this.cbRows : this.stockRows
        const rows = src.filter(r => r.code).map(r => ({ code: r.code, name: r.name, shares: r.shares }))
        const today = new Date().toISOString().slice(0, 10)
        await fetch(`/api/positions/${strategy}?position_date=${today}`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(rows),
        })
        src.forEach(r => { r.isNew = false })

        // 2. 保存账户快照（现金 + 总资产回写）
        if (this.loaded[strategy]) {
          const totalKey = strategy === 'cb' ? 'bond_total' : 'stock_total'
          this.form[totalKey] = this.accountTotal(strategy)
        }
        const payload = this.snapshotPayload()
        await fetch('/api/account/snapshot', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        })
        Object.assign(this.form, payload)

        // 3. 标记已保存
        if (strategy === 'cb') { this.cbSaved = true; setTimeout(() => this.cbSaved = false, 2000) }
        else { this.stockSaved = true; setTimeout(() => this.stockSaved = false, 2000) }
      },
    }
  }

  function tradingPage() {
    return {
      // T 日数据
      tDate: new Date().toISOString().slice(0, 10), temperature: 0, tDaySaved: false,
      // 资金分配 + 订单
      plan: null,
      sizingCb: false, sizingStock: false,
      // 排名
      running: false, error: '',
      cbItems: [], stockItems: [],
      cbDates: [], stockDates: [],
      cbDate: '', stockDate: '',
      cbTradeDate: '', stockTradeDate: '',
      showCbRank: false, showStockRank: false,

      async init() {
        const [snap, planData] = await Promise.all([
          fetch('/api/account/latest').then(r => r.json().catch(() => null)),
          this.loadPlan(),
        ])
        if (snap) {
          this.tDate = snap.snapshot_date || this.tDate
          this.temperature = snap.temperature || 0
        }
        const [cbD, stD] = await Promise.all([
          fetch('/api/rankings/cb/dates').then(r => r.json()),
          fetch('/api/rankings/stock/dates').then(r => r.json()),
        ])
        this.cbDates = cbD.sort().reverse(); this.cbDate = this.cbDates[0] || ''
        this.stockDates = stD.sort().reverse(); this.stockDate = this.stockDates[0] || ''
        if (this.cbDate) await this.loadCb()
        if (this.stockDate) await this.loadStock()
        this.plan = planData
      },

      async loadPlan() {
        const t = Number(this.temperature) || 0
        this.plan = await fetch(`/api/plan?temperature=${t}`).then(r => r.json())
      },

      async saveTDay() {
        // 只更新温度+日期，保留已有账户数据
        const snap = await fetch('/api/account/latest').then(r => r.json().catch(() => ({})))
        await fetch('/api/account/snapshot', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            snapshot_date: this.tDate,
            temperature: Number(this.temperature) || 0,
            stock_total: snap.stock_total || 0, stock_cash: snap.stock_cash || 0,
            bond_total: snap.bond_total || 0, bond_cash: snap.bond_cash || 0,
            changqian_total: snap.changqian_total || 0,
            cash_pool: snap.cash_pool || 0,
            overseas_total: snap.overseas_total || 0,
          }),
        })
        this.tDaySaved = true
        setTimeout(() => this.tDaySaved = false, 2000)
        await this.loadPlan()
      },

      // ── 排名 ──
      async loadCb() {
        if (!this.cbDate) return
        const r = await fetch(`/api/rankings/cb/${this.cbDate}`).then(r => r.json())
        this.cbItems = r.items || []
        this.cbTradeDate = r.trade_date || ''
      },
      async loadStock() {
        if (!this.stockDate) return
        const r = await fetch(`/api/rankings/stock/${this.stockDate}`).then(r => r.json())
        this.stockItems = r.items || []
        this.stockTradeDate = r.trade_date || ''
      },
      async runStrategy(strategy) {
        this.running = true; this.error = ''
        try {
          const res = await fetch(`/api/rankings/${strategy}/run`, { method: 'POST' })
          if (!res.ok) {
            const body = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }))
            const msg = typeof body.detail === 'object' ? body.detail.message : String(body.detail || `请求失败 (${res.status})`)
            throw new Error(msg)
          }
          const data = await res.json()
          const datesRes = await fetch(`/api/rankings/${strategy}/dates`).then(r => r.json())
          if (strategy === 'cb') {
            this.cbDates = datesRes.sort().reverse(); this.cbDate = this.cbDates[0] || ''
            this.cbItems = data.items || []; this.cbTradeDate = data.trade_date || ''
          } else {
            this.stockDates = datesRes.sort().reverse(); this.stockDate = this.stockDates[0] || ''
            this.stockItems = data.items || []; this.stockTradeDate = data.trade_date || ''
          }
          await this.loadPlan()
        } catch (e) {
          this.error = e.message || '运行失败'
        } finally {
          this.running = false
        }
      },
      async exportMd(strategy) {
        const date = strategy === 'cb' ? this.cbDate : this.stockDate
        const r = await fetch(`/api/rankings/${strategy}/${date}/export`)
        const text = await r.text()
        const blob = new Blob([text], {type: 'text/plain'})
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = `${strategy}_top20_${date}.md`
        a.click()
      },

      // ── 订单 ──
      fmtMoney(v) {
        return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      },
      executionDate() {
        return this.plan?.stock?.trade_date || this.plan?.cb?.trade_date || ''
      },
      groupClass(action) {
        if (action === 'BUY' || action === 'ADD') return 'text-green-600'
        if (action === 'SELL') return 'text-red-500'
        if (action === 'TRIM') return 'text-orange-500'
        return 'text-gray-500'
      },
      adjustedCash(strategy) {
        const cf = strategy === 'cb' ? 'bond_cash' : 'stock_cash'
        const dk = strategy === 'cb' ? 'bond' : 'stock'
        const base = this.plan?.account?.[cf] || 0
        const delta = this.plan?.transfer_deltas?.[dk] || 0
        return Math.round(base + delta)
      },
      async sizeOrders(strategy) {
        const key = strategy === 'cb' ? 'sizingCb' : 'sizingStock'
        if (!this.plan?.account) { alert('请先在账户详情页录入账户信息'); return }
        const cashField = strategy === 'cb' ? 'bond_cash' : 'stock_cash'
        const deltaKey = strategy === 'cb' ? 'bond' : 'stock'
        // 基础现金 + 资金分配增量（调拨后实际可用现金）
        const baseCash = this.plan.account[cashField] || 0
        const delta = this.plan?.transfer_deltas?.[deltaKey] || 0
        const cash = Math.round(baseCash + delta)
        this[key] = true
        try {
          const r = await fetch(`/api/plan/${strategy}/size-orders`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cash}),
          })
          if (!r.ok) { const e = await r.json(); alert(e.detail?.message || '生成失败'); return }
          await this.loadPlan()
        } finally { this[key] = false }
      },
      cbGroups() {
        const orders = this.plan?.cb?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && r.shares !== 0)
        })).filter(g => g.items.length)
      },
      stockGroups() {
        const orders = this.plan?.stock?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && r.shares !== 0)
        })).filter(g => g.items.length)
      },
    }
  }
</script>
</body>
