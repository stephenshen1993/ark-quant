<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ark-quant</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://unpkg.com">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  .order-plan-table {
    table-layout: fixed;
    width: 100%;
  }
  .order-group-grid {
    align-items: start;
  }
  .order-code-col { width: 16%; }
  .order-name-col { width: 30%; }
  .order-quantity-col { width: 18%; }
  .order-price-col { width: 16%; }
  .order-amount-col { width: 20%; }
  .order-plan-table th,
  .order-plan-table td {
    padding-top: 0.375rem;
    padding-bottom: 0.375rem;
  }
  .order-plan-table .order-name-cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  :root {
    --ark-bg: #f7f8fa;
    --ark-panel: #ffffff;
    --ark-text: #111827;
    --ark-muted: #6b7280;
    --ark-soft: #9ca3af;
    --ark-line: #e5e7eb;
    --ark-faint: #eef2f7;
    --ark-accent: #0f766e;
    --ark-changelog-canvas: #f4f5f6;
    --ark-changelog-surface: #ffffff;
    --ark-changelog-ink: #1b2733;
    --ark-changelog-secondary: #5c6672;
    --ark-changelog-tertiary: #858c96;
    --ark-changelog-line: #e3e4e7;
    --ark-changelog-nav-active: #e9eef0;
    --ark-changelog-accent: #125e6c;
    --ark-changelog-update: #2e7e5d;
    --ark-changelog-neutral: #66717e;
    --ark-nav-width: 179px;
    --ark-reading-width: 833px;
    --ark-reading-top: 80px;
    --ark-header-stream-gap: 61px;
    --ark-date-group-gap: 72px;
    --ark-reading-time-column: 86px;
    --ark-entry-column-gap: 22px;
    --ark-entry-copy-indent: 24px;
    --ark-font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --ark-font-data: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  body.bg-gray-50 {
    background: var(--ark-bg);
    -webkit-tap-highlight-color: transparent;
  }
  .app-nav {
    width: var(--ark-nav-width);
    padding: 48px 18px 24px;
    background: var(--ark-changelog-surface);
    border-right: 1px solid var(--ark-changelog-line);
    touch-action: manipulation;
  }
  .changelog-brand {
    padding: 0 6px 36px;
    border-bottom: 1px solid var(--ark-changelog-line);
    margin-bottom: 34px;
  }
  .changelog-brand-name {
    color: var(--ark-changelog-ink);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.2em;
    line-height: 1;
  }
  .changelog-brand-subtitle {
    margin-top: 14px;
    color: var(--ark-changelog-tertiary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .app-nav-section {
    margin: 0 0 16px 18px;
    color: var(--ark-changelog-tertiary);
    font-size: 12px;
    font-weight: 600;
  }
  .nav-item {
    min-height: 42px;
    border-radius: 8px;
    color: var(--ark-changelog-secondary);
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
  }
  .nav-item:hover {
    background: #f3f4f6;
    color: var(--ark-changelog-ink);
  }
  .nav-item[aria-current="page"] {
    background: var(--ark-changelog-nav-active);
    color: var(--ark-changelog-accent);
  }
  .nav-item[aria-current="page"] .nav-icon {
    color: var(--ark-changelog-accent);
  }
  .nav-item:focus-visible {
    outline: 2px solid var(--ark-changelog-ink);
    outline-offset: 2px;
  }
  .nav-icon {
    width: 20px;
    height: 20px;
    text-align: center;
    color: #748092;
    font-size: 16px;
    line-height: 1;
  }
  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
  }
  .app-nav-footer {
    margin-top: auto;
    padding: 12px 10px 0;
    border-top: 1px solid var(--ark-changelog-line);
    color: var(--ark-changelog-tertiary);
    font-size: 11px;
    line-height: 1.6;
  }
  .app-main {
    background: var(--ark-bg);
    padding: 0 0 96px;
    overflow-x: hidden;
  }
  .app-main:has(.changelog-shell) {
    background: var(--ark-changelog-canvas);
  }
  .workspace-shell {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 76px 0 96px;
  }
  .workspace-shell-workbench {
    max-width: 1080px;
  }
  .workspace-shell-wide {
    max-width: 1120px;
  }
  .workspace-kicker {
    margin-bottom: 14px;
    color: var(--ark-accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.24em;
  }
  .workspace-title-row {
    align-items: end;
    border-bottom: 1px solid var(--ark-line);
    margin-bottom: 26px;
    padding-bottom: 22px;
  }
  .workspace-title {
    color: var(--ark-text);
    font-size: 34px;
    font-weight: 700;
    line-height: 1.2;
  }
  .workspace-meta {
    color: var(--ark-muted);
    font-size: 14px;
    font-weight: 600;
  }
  .ark-panel {
    background: var(--ark-panel);
    border: 1px solid var(--ark-faint);
    border-radius: 8px;
    box-shadow: none;
  }
  .ark-panel + .ark-panel {
    margin-top: 16px;
  }
  .account-total-card {
    border-color: var(--ark-line);
  }
  .account-ledger {
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
  }
  .responsive-table-scroll {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .changelog-shell {
    width: 100%;
    max-width: var(--ark-reading-width);
    margin: 0 auto;
    padding: var(--ark-reading-top) 0 96px;
    color: var(--ark-changelog-ink);
    font-family: var(--ark-font-sans);
  }
  .changelog-kicker {
    margin: 0 0 16px;
    color: var(--ark-changelog-accent);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.23em;
    line-height: 16px;
  }
  .changelog-title {
    margin: 0;
    color: var(--ark-changelog-ink);
    font-size: 32px;
    font-weight: 680;
    letter-spacing: -0.035em;
    line-height: 39.04px;
    text-wrap: balance;
  }
  .changelog-subtitle {
    margin: 12px 0 0;
    color: var(--ark-changelog-secondary);
    font-size: 17px;
    font-weight: 400;
    line-height: 27.2px;
  }
  .changelog-header {
    margin-bottom: var(--ark-header-stream-gap);
  }
  .changelog-groups {
    display: flex;
    flex-direction: column;
    gap: var(--ark-date-group-gap);
  }
  .changelog-date-header {
    display: flex;
    align-items: baseline;
    gap: 22px;
    min-height: 44px;
    border-bottom: 1px solid var(--ark-changelog-line);
    padding-bottom: 12px;
  }
  .changelog-date-title {
    margin: 0;
    color: var(--ark-changelog-ink);
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 31.2px;
    text-wrap: balance;
  }
  .changelog-weekday {
    color: var(--ark-changelog-tertiary);
    font-size: 13px;
    font-weight: 400;
    line-height: 16.9px;
  }
  .changelog-entry-grid {
    display: grid;
    grid-template-columns: var(--ark-reading-time-column) minmax(0, 1fr);
    column-gap: var(--ark-entry-column-gap);
    border-bottom: 1px solid var(--ark-changelog-line);
    padding: 25px 0;
  }
  .changelog-entry-grid:last-child {
    border-bottom: 0;
  }
  .changelog-entry-meta {
    padding-top: 1px;
  }
  .changelog-entry-time {
    display: block;
    color: var(--ark-changelog-ink);
    font-family: var(--ark-font-data);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.03em;
    line-height: 20px;
    font-variant-numeric: tabular-nums;
  }
  .changelog-entry-type {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 13px;
    font-size: 14px;
    font-weight: 560;
    line-height: 18.9px;
  }
  .changelog-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
  }
  .changelog-entry-type .changelog-dot {
    background: currentColor;
  }
  .changelog-entry-type.changelog-type-optimize {
    color: var(--ark-changelog-accent);
  }
  .changelog-entry-type.changelog-type-update {
    color: var(--ark-changelog-update);
  }
  .changelog-entry-type.changelog-type-neutral {
    color: var(--ark-changelog-neutral);
  }
  .changelog-entry-type.changelog-type-retired {
    color: #b45309;
  }
  .changelog-entry-main {
    border-left: 1px solid var(--ark-changelog-line);
    padding-left: var(--ark-entry-copy-indent);
    min-width: 0;
  }
  .changelog-entry-title {
    margin: 0;
    color: var(--ark-changelog-ink);
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.018em;
    line-height: 25.2px;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .changelog-entry-body {
    margin: 13px 0 0;
    color: var(--ark-changelog-secondary);
    font-size: 16px;
    font-weight: 400;
    line-height: 28px;
    overflow-wrap: anywhere;
    text-wrap: pretty;
  }
  @media (max-width: 720px) {
    body {
      flex-direction: column;
      height: auto;
      min-height: 100vh;
    }
    .app-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
      height: 64px;
      min-height: 64px;
      flex-direction: row !important;
      align-items: center;
      overflow: hidden;
      padding: 0 20px;
      border-right: 0;
      border-bottom: 1px solid var(--ark-changelog-line);
    }
    .changelog-brand {
      flex: 1;
      padding: 0;
      margin: 0;
      border-bottom: 0;
    }
    .changelog-brand-name {
      font-size: 20px;
      letter-spacing: 0.12em;
    }
    .changelog-brand-subtitle,
    .app-nav-section,
    .app-nav-footer {
      display: none;
    }
    .nav-label {
      display: none;
    }
    .nav-item {
      flex: 0 0 36px;
      justify-content: center;
      width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 0 !important;
    }
    .app-main {
      min-height: calc(100vh - 64px);
    }
    .workspace-shell {
      padding: 54px 20px 72px;
    }
    .workspace-title-row {
      align-items: start;
    }
    .workspace-title {
      font-size: 30px;
    }
    .account-total-card .text-4xl {
      font-size: 30px;
      line-height: 1.2;
    }
    .account-ledger {
      display: block;
    }
    .account-ledger tbody {
      display: block;
    }
    .account-ledger-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      column-gap: 10px;
      row-gap: 8px;
      align-items: center;
      padding: 16px;
    }
    .account-ledger-row > td {
      display: block;
      width: auto !important;
      padding: 0 !important;
    }
    .account-ledger-row > td:nth-child(2) {
      min-width: 0;
    }
    .account-ledger-row > td:nth-child(2) span {
      overflow-wrap: anywhere;
    }
    .account-ledger-row > td:nth-child(3) {
      grid-column: 3;
      grid-row: 1;
      white-space: nowrap;
    }
    .account-ledger-row > td:nth-child(4) {
      grid-column: 3;
      grid-row: 2;
      white-space: nowrap;
    }
    .account-ledger-row > td:nth-child(5) {
      grid-column: 2;
      grid-row: 2;
      text-align: left !important;
    }
    .account-ledger-row > td:nth-child(6) {
      display: none;
    }
    .account-position-row {
      display: block;
    }
    .account-position-row > td {
      display: block;
      width: 100% !important;
      padding: 16px !important;
    }
    .account-position-row .flex.items-center.gap-3 {
      align-items: start;
      flex-direction: column;
    }
    .changelog-shell {
      padding: 42px 22px 88px;
    }
    .changelog-kicker {
      margin-bottom: 15px;
    }
    .changelog-title {
      font-size: 32px;
    }
    .changelog-subtitle {
      font-size: 15px;
    }
    .changelog-header {
      margin-bottom: 50px;
    }
    .changelog-groups {
      gap: 58px;
    }
    .changelog-date-header {
      display: block;
      min-height: 0;
      padding-bottom: 14px;
    }
    .changelog-date-title {
      font-size: 24px;
    }
    .changelog-weekday {
      display: block;
      margin-top: 7px;
    }
    .changelog-entry-grid {
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 22px 0 24px;
    }
    .changelog-entry-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .changelog-entry-type {
      margin-top: 0;
    }
    .changelog-entry-main {
      padding-left: 16px;
    }
    .changelog-entry-title {
      font-size: 19px;
    }
    .changelog-entry-body {
      font-size: 15px;
      line-height: 1.7;
    }
  }
</style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen antialiased">

<!-- 侧边导航 -->
<nav
  x-data
  aria-label="主导航"
  class="app-nav flex flex-col gap-1 shrink-0">
  <div class="changelog-brand">
    <div class="changelog-brand-name">ARK</div>
    <div class="changelog-brand-subtitle">quant journal</div>
  </div>
  <div class="app-nav-section">工作台</div>
  <button @click="$dispatch('nav', 'account')"
    aria-label="账户"
    :aria-current="$store.page === 'account' ? 'page' : null"
    :class="$store.page === 'account'
      ? 'bg-gray-100 text-gray-900 font-medium'
      : 'text-gray-500 hover:bg-gray-50'"
    class="nav-item flex items-center gap-2 px-3 py-2 text-left w-full">
    <i class="nav-icon" data-lucide="bar-chart-3" aria-hidden="true"></i>
    <span class="nav-label">账户</span>
  </button>
  <button @click="$dispatch('nav', 'trading')"
    aria-label="计划"
    :aria-current="$store.page === 'trading' ? 'page' : null"
    :class="$store.page === 'trading'
      ? 'bg-gray-100 text-gray-900 font-medium'
      : 'text-gray-500 hover:bg-gray-50'"
    class="nav-item flex items-center gap-2 px-3 py-2 text-left w-full">
    <i class="nav-icon" data-lucide="square" aria-hidden="true"></i>
    <span class="nav-label">计划</span>
  </button>
  <div class="app-nav-section mt-7">更多</div>
  <button @click="$dispatch('nav', 'changelog')"
    aria-label="更新日志"
    :aria-current="$store.page === 'changelog' ? 'page' : null"
    :class="$store.page === 'changelog'
      ? 'bg-gray-100 text-gray-900 font-medium'
      : 'text-gray-500 hover:bg-gray-50'"
    class="nav-item flex items-center gap-2 px-3 py-2 text-left w-full">
    <i class="nav-icon" data-lucide="history" aria-hidden="true"></i>
    <span class="nav-label">更新日志</span>
  </button>
  <div class="app-nav-footer">
    <div>ark-quant</div>
    <div>本地投资工作台</div>
  </div>
</nav>

<!-- 主内容 -->
<main
  aria-label="工作台内容"
  class="app-main flex-1 overflow-auto"
  x-data
  @nav.window="setActivePage($event.detail)">

  <!-- 账户总览 -->
  <div x-show="$store.page === 'account'" x-data="accountPage()" x-init="ensureLoaded($store.page)" x-effect="ensureLoaded($store.page)" role="region" aria-label="账户工作台">

    <div role="region" aria-label="账户内容区域" class="workspace-shell workspace-shell-workbench">
      <!-- 标题栏 -->
      <div class="workspace-title-row flex justify-between gap-5">
        <div>
          <div class="workspace-kicker">WORKBENCH</div>
          <h1 class="workspace-title tracking-normal">账户</h1>
        </div>
        <label class="workspace-meta flex items-center gap-2">
          账户事实日
          <input type="date" aria-label="账户事实日" x-model="form.snapshot_date" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 bg-white">
        </label>
      </div>

      <!-- 总资产 -->
      <section aria-label="账户资产总览" class="ark-panel account-total-card p-6 mb-5">
        <div class="flex items-baseline gap-3">
          <span class="text-sm text-gray-400">总资产</span>
          <span class="text-4xl font-semibold tracking-normal tabular-nums" x-text="fmtMoney(totalAssets())"></span>
        </div>
        <div x-show="!summary" class="text-sm text-gray-400 mt-2">暂无账户数据。</div>
      </section>

      <!-- 账户列表 -->
      <table aria-label="账户明细" class="ark-panel account-ledger w-full table-fixed">
        <template x-for="acc in accounts" :key="acc.id">
          <tbody>
            <tr @click="acc.posType ? toggleExpand(acc.id) : null"
              :class="acc.posType ? 'cursor-pointer hover:bg-gray-50' : ''"
              class="account-ledger-row border-b border-gray-50 last:border-b-0">
              <td class="pl-5 py-3.5" style="width:32px"><div :style="'background:' + acc.color" class="w-2.5 h-2.5 rounded-full"></div></td>
              <td class="py-3.5 pr-4">
                <div><span class="text-sm font-medium" x-text="acc.label"></span><span class="text-xs text-gray-400 ml-2" x-text="acc.sub"></span></div>
                <div class="text-xs text-gray-400 mt-0.5" x-text="accountRole(acc)"></div>
              </td>
              <td class="py-3.5 pr-4 text-right"><span x-show="acc.posType" class="text-sm font-semibold tabular-nums" x-text="fmtMoney(num(form[acc.totalKey]))"></span><span x-show="!acc.posType"><span x-show="editingSimple === acc.id" class="flex items-baseline gap-1 justify-end"><span class="text-sm text-gray-400">¥</span><input type="text" inputmode="decimal" x-model="form[acc.totalKey]" @blur="saveSimpleAccount(acc.id)" @keyup.enter="$el.blur()" x-init="$el.focus()" class="text-sm font-semibold tabular-nums bg-transparent text-right outline-none border-b border-gray-200 w-28" placeholder="0"></span><span x-show="editingSimple !== acc.id" @click.stop="editingSimple = acc.id" class="text-sm font-semibold tabular-nums cursor-pointer" x-text="fmtMoney(num(form[acc.totalKey]))"></span></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400 tabular-nums"><span x-text="acctPct(acc)"></span></td>
              <td class="py-3.5 pr-4 text-right text-xs text-gray-400"><span x-text="accUpdateDate(acc)"></span></td>
              <td class="py-3.5 pr-5 text-center" style="width:28px"><span x-show="acc.posType" class="text-gray-300 text-sm" x-text="expanded === acc.id ? '▾' : '▸'"></span></td>
            </tr>
            <tr x-show="expanded === 'stock' && acc.id === 'stock'" class="account-position-row border-b border-gray-50">
              <td colspan="6" class="bg-gray-50/30 px-5 py-4">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-gray-400">可用 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.stock_available_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">冻结 ¥</span>
                <input type="text" inputmode="decimal" x-model="form.stock_frozen_cash" class="text-sm font-semibold w-28 bg-white border border-gray-200 rounded px-2 py-1 outline-none focus:border-gray-400" placeholder="0">
                <span class="text-xs text-gray-400">现金总额 <span x-text="fmtMoney(accountCash('stock'))"></span></span>
              </div>
              <div class="responsive-table-scroll account-position-table-scroll">
              <table class="w-full min-w-[640px] table-fixed text-sm"><thead><tr class="text-xs text-gray-400 border-b border-gray-200"><th class="text-left font-normal py-1.5">代码</th><th class="text-left font-normal py-1.5">名称</th><th class="text-right font-normal py-1.5">股数</th><th class="text-right font-normal py-1.5">现价</th><th class="text-right font-normal py-1.5">市值</th><th class="text-right font-normal py-1.5">占比</th><th style="width:24px"></th></tr></thead>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) window.lucide.createIcons()
  })

  // Alpine store for active page
  document.addEventListener('alpine:init', () => {
    Alpine.store('page', pageFromLocation())
  })

  window.addEventListener('hashchange', () => {
    if (window.Alpine) Alpine.store('page', pageFromLocation())
  })

  function pageFromLocation() {
    const page = window.location.hash.replace(/^#/, '')
    return ['account', 'trading', 'changelog'].includes(page) ? page : 'account'
  }

  function setActivePage(page) {
    if (!['account', 'trading', 'changelog'].includes(page)) return
    Alpine.store('page', page)
    const nextHash = page === 'account' ? '' : `#${page}`
    if (window.location.hash !== nextHash) {
      history.pushState(null, '', `${window.location.pathname}${window.location.search}${nextHash}`)
    }
    requestAnimationFrame(() => {
      const main = document.querySelector('.app-main')
      if (main) main.scrollTo({ top: 0, left: 0 })
      window.scrollTo({ top: 0, left: 0 })
    })
  }

  function localDate() {
    const now = new Date()
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    return local.toISOString().slice(0, 10)
  }

  function changelogPage() {
    return {
      entries: [],
      loadError: '',
      async load() {
        try {
          const response = await fetch('/static/changelog.json')
          if (!response.ok) throw new Error('更新日志加载失败')
          const entries = await response.json()
          this.entries = entries
            .slice()
            .sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`))
        } catch (error) {
          this.loadError = error.message || '更新日志加载失败'
        }
      },
      groupedEntries() {
        const groups = []
        this.entries.forEach(entry => {
          let group = groups.find(item => item.date === entry.date)
          if (!group) {
            group = { date: entry.date, entries: [] }
            groups.push(group)
          }
          group.entries.push(entry)
        })
        return groups
      },
      formatGroupDate(dateText) {
        const [year, month, day] = String(dateText).split('-').map(Number)
        if (!year || !month || !day) return dateText
        const parts = new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
        }).formatToParts(new Date(year, month - 1, day))
        const values = Object.fromEntries(parts.map(part => [part.type, part.value]))
        return `${values.year} 年 ${values.month} 月 ${values.day} 日`
      },
      weekdayText(dateText) {
        const [year, month, day] = String(dateText).split('-').map(Number)
        if (!year || !month || !day) return ''
        return new Intl.DateTimeFormat('zh-CN', { weekday: 'short' }).format(new Date(year, month - 1, day))
      },
      typeTextClass(type) {
        const classes = {
          更新: 'changelog-type-update',
          优化: 'changelog-type-optimize',
          公告: 'changelog-type-neutral',
          下线: 'changelog-type-retired',
        }
        return classes[type] || 'changelog-type-neutral'
      },
      typeDotClass(type) {
        const classes = {
          更新: 'bg-emerald-600',
          优化: 'bg-teal-700',
          公告: 'bg-gray-400',
          下线: 'bg-amber-600',
        }
        return classes[type] || 'bg-gray-400'
      },
    }
  }

  // 账户总览（含持仓）
  function accountPage() {
    return {
      summary: null,
      expanded: null, editingSimple: null,
      cbSaved: false, stockSaved: false,
      cbRows: [], stockRows: [],
      prices: { stock: {}, cb: {} },   // code -> {name, price}
      loaded: { stock: false, cb: false },
      _uid: 0,
      _sortTimers: {},
      loadedOnce: false,
      accounts: [
        { id: 'stock',    label: '广发账户', sub: '证券交易与托管', color: '#8b5cf6', totalKey: 'stock_total',     cashKey: 'stock_cash', posType: 'stock' },
        { id: 'cb',       label: '华泰账户', sub: '证券交易与托管', color: '#14b8a6', totalKey: 'bond_total',      cashKey: 'bond_cash',  posType: 'cb'    },
        { id: 'changqian',label: '长钱投顾组合', sub: '雪球基金托管', color: '#f59e0b', totalKey: 'changqian_total', posType: null    },
        { id: 'overseas', label: '海外长钱投顾组合', sub: '雪球基金托管', color: '#60a5fa', totalKey: 'overseas_total',  posType: null    },
        { id: 'cash',     label: '浦发现金账户', sub: '资金调拨与现金管理', color: '#9ca3af', totalKey: 'cash_pool',       posType: null    },
      ],
      form: {
        snapshot_date: localDate(),
        temperature: null, stock_total: null, stock_available_cash: null, stock_frozen_cash: 0,
        bond_total: null, bond_available_cash: null, bond_frozen_cash: 0, changqian_total: null,
        cash_pool: null, overseas_total: null,
        _stock_updated: '', _cb_updated: '',
      },
      async load() {
        const summary = await fetch('/api/account/summary').then(r => r.json())
        this.applySummary(summary)
        const positionDate = this.form.snapshot_date
        const [cb, stock] = await Promise.all([
          fetch(`/api/positions/cb?date=${positionDate}&asof=true`).then(r => r.json()),
          fetch(`/api/positions/stock?date=${positionDate}&asof=true`).then(r => r.json()),
        ])
        this.cbRows = cb.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        this.stockRows = stock.map(r => ({ ...r, _id: ++this._uid, isNew: false }))
        // per-account 更新日期
        const contextDate = summary?.context?.snapshot_date || ''
        this.form._stock_updated = stock.length > 0 ? stock[0].position_date : contextDate
        this.form._cb_updated = cb.length > 0 ? cb[0].position_date : contextDate
        // 自动加载行情
        await Promise.all([this.loadQuotes('stock'), this.loadQuotes('cb')])
      },
      ensureLoaded(page) {
        if (page !== 'account' || this.loadedOnce) return
        this.loadedOnce = true
        this.load().catch(err => {
          this.loadedOnce = false
          console.error(err)
        })
      },
      accountItem(id) {
        return (this.summary?.accounts || []).find(item => item.id === id) || null
      },
      applySummary(summary) {
        this.summary = summary
        if (!summary) return
        const context = summary.context || {}
        this.form.temperature = context.temperature ?? this.form.temperature
        ;(summary.accounts || []).forEach(item => {
          const acc = this.accounts.find(a => a.id === item.id)
          if (!acc) return
          this.form[acc.totalKey] = item.total
          if (acc.cashKey) {
            this.form[acc.cashKey.replace('_cash', '_available_cash')] = item.available_cash
            this.form[acc.cashKey.replace('_cash', '_frozen_cash')] = item.frozen_cash || 0
          }
        })
        ;(summary.read_model?.accounts || []).forEach(item => {
          const acc = this.accounts.find(a => a.id === item.id)
          if (!acc) return
          acc.label = item.name || acc.label
          acc.sub = item.portfolio_node_name || acc.sub
          acc.readModel = item
        })
      },
      addRow(strategy) {
        const row = { code: '', name: '', shares: 0, _id: ++this._uid, isNew: true }
        ;(strategy === 'cb' ? this.cbRows : this.stockRows).push(row)
      },
      removeRow(strategy, row) {
        const rows = strategy === 'cb' ? this.cbRows : this.stockRows
        const i = rows.indexOf(row)
        if (i >= 0) rows.splice(i, 1)
      },
      fmtMoney(v) { return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
      num(v) { return Number.isFinite(Number(v)) ? Number(v) : 0 },
      totalAssets() {
        const f = this.form
        return this.num(f.stock_total) + this.num(f.bond_total) + this.num(f.changqian_total) + this.num(f.cash_pool) + this.num(f.overseas_total)
      },
      async loadQuotes(strategy) {
        const q = await fetch(`/api/positions/${strategy}/quotes?date=${this.form.snapshot_date}&asof=true`).then(r => r.json())
        const map = {}
        ;(q.items || []).forEach(it => { map[it.code] = { name: it.name, price: it.price } })
        this.prices[strategy] = map
        this.loaded[strategy] = true
        this.sortRowsByValue(strategy)
      },
      async autofill(strategy, row) {
        const code = String(row.code || '').trim()
        if (!code) return
        const q = await fetch(`/api/positions/${strategy}/quote?code=${code}`).then(r => r.json())
        if (q && q.price != null) {
          this.prices[strategy] = { ...this.prices[strategy], [String(code).padStart(6, '0')]: { name: q.name, price: q.price } }
          if (q.name) row.name = q.name
          this.scheduleSortRows(strategy)
        }
      },
      rowPrice(strategy, code) {
        return this.prices[strategy][String(code || '').padStart(6, '0')]?.price ?? null
      },
      rowValue(strategy, row) {
        const p = this.rowPrice(strategy, row.code)
        return p != null ? p * (row.shares || 0) : null
      },
      holdingsValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        return rows.reduce((s, r) => s + (this.rowValue(strategy, r) || 0), 0)
      },
      rowWeight(strategy, row) {
        const total = this.holdingsValue(strategy)
        const v = this.rowValue(strategy, row)
        return (total && v != null) ? v / total : null
      },
      accountCash(strategy) {
        const availableKey = strategy === 'stock' ? 'stock_available_cash' : 'bond_available_cash'
        const frozenKey = strategy === 'stock' ? 'stock_frozen_cash' : 'bond_frozen_cash'
        const raw = this.form[availableKey]
        if (raw !== null && raw !== undefined && raw !== '') return this.num(raw) + this.num(this.form[frozenKey])
        const accountId = strategy === 'stock' ? 'stock' : 'cb'
        return this.num(this.accountItem(accountId)?.cash)
      },
      accountAvailableCash(strategy) {
        const key = strategy === 'stock' ? 'stock_available_cash' : 'bond_available_cash'
        const raw = this.form[key]
        if (raw !== null && raw !== undefined && raw !== '') return this.num(raw)
        const accountId = strategy === 'stock' ? 'stock' : 'cb'
        return this.num(this.accountItem(accountId)?.available_cash)
      },
      accountTotal(strategy) {
        return this.holdingsValue(strategy) + this.accountCash(strategy)
      },
      sortRowsByValue(strategy) {
        const rows = strategy === 'stock' ? this.stockRows : this.cbRows
        rows.sort((a, b) => (this.rowValue(strategy, b) || 0) - (this.rowValue(strategy, a) || 0))
      },
      scheduleSortRows(strategy) {
        clearTimeout(this._sortTimers[strategy])
        this._sortTimers[strategy] = setTimeout(() => this.sortRowsByValue(strategy), 250)
      },
      toggleExpand(id) { this.expanded = this.expanded === id ? null : id },
      acctPct(acc) {
        const total = this.totalAssets()
        return total > 0 ? (this.num(this.form[acc.totalKey]) / total * 100).toFixed(1) + '%' : '0%'
      },
      accountRole(acc) {
        return acc.readModel?.role || ''
      },
      accUpdateDate(acc) {
        const accountDate = this.accountItem(acc.id)?.snapshot_date
        if (accountDate) return this.formatFactDate(accountDate)
        if (acc.posType) {
          const d = this.form['_' + acc.id + '_updated'] || ''
          return d ? this.formatFactDate(d) : ''
        }
        return this.form.snapshot_date ? this.formatFactDate(this.form.snapshot_date) : ''
      },
      formatFactDate(value) {
        if (!value) return ''
        return '事实日 ' + String(value).slice(0, 10)
      },
      async saveSimpleAccount(id) {
        this.editingSimple = null
        await this.saveAccountSnapshot(id)
      },
      accountSnapshotPayload(id) {
        const acc = this.accounts.find(a => a.id === id)
        const available_cash = id === 'stock' ? this.accountAvailableCash('stock')
          : id === 'cb' ? this.accountAvailableCash('cb')
          : null
        const frozen_cash = id === 'stock' ? this.num(this.form.stock_frozen_cash)
          : id === 'cb' ? this.num(this.form.bond_frozen_cash)
          : null
        return {
          snapshot_date: this.form.snapshot_date || localDate(),
          total: acc ? this.num(this.form[acc.totalKey]) : 0,
          available_cash,
          frozen_cash,
        }
      },
      async saveAccountSnapshot(id) {
        const res = await fetch(`/api/account/${id}/snapshot`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.accountSnapshotPayload(id)),
        })
        if (!res.ok) throw new Error('保存账户失败')
        const saved = await res.json()
        this.applySummary(saved)
      },
      async saveAccount(strategy) {
        try {
          const src = strategy === 'cb' ? this.cbRows : this.stockRows
          const rows = src.filter(r => r.code).map(r => ({ code: r.code, name: r.name, shares: r.shares }))
          const positionDate = this.form.snapshot_date || localDate()

          // 持仓与账户金额必须同一事务写入，避免部分保存。
          if (this.loaded[strategy]) {
            const totalKey = strategy === 'cb' ? 'bond_total' : 'stock_total'
            this.form[totalKey] = this.accountTotal(strategy)
          }
          const account = this.accountSnapshotPayload(strategy)
          const res = await fetch(`/api/account/${strategy}/state`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ...account, snapshot_date: positionDate, positions: rows }),
          })
          if (!res.ok) {
            const error = await res.json().catch(() => null)
            throw new Error(error?.detail || '保存账户状态失败')
          }
          this.applySummary(await res.json())
          src.forEach(r => { r.isNew = false })

          // 标记已保存
          if (strategy === 'cb') { this.cbSaved = true; setTimeout(() => this.cbSaved = false, 2000) }
          else { this.stockSaved = true; setTimeout(() => this.stockSaved = false, 2000) }
        } catch (err) {
          console.error(err)
          alert(err.message || '保存账户状态失败')
        }
      },
    }
  }

  function tradingPage() {
    return {
      // T 日数据
      tDate: localDate(), marketTemperature: null,
      // 资金分配 + 订单
      plan: null, transferPlan: null, accountReadModel: null, planError: '', loadingPlan: false, planReady: false,
      generationStage: '', componentErrors: { cb: '', stock: '' },
      funding: { snapshot_date: '', temperature: null, check_type: 'a_internal', new_contribution: 0, b_purchase_status: 'unchecked', b_purchase_limit: 0 },
      basisExpanded: { A: true },
      sizingCb: false, sizingStock: false,
      // 排名
      running: { cb: false, stock: false },
      cbItems: [], stockItems: [],
      cbDates: [], stockDates: [],
      cbDate: '', stockDate: '',
      cbTradeDate: '', stockTradeDate: '',
      showCbRank: false, showStockRank: false,
      async init() {
        try {
          const summary = await fetch('/api/account/summary').then(r => r.json().catch(() => null))
          if (summary) {
            this.accountReadModel = summary.read_model || this.accountReadModel
            this.tDate = summary.context?.snapshot_date || this.tDate
            const context = summary.context || {}
            this.funding.snapshot_date = context.snapshot_date || this.tDate
            this.funding.temperature = context.temperature
            this.funding.check_type = this.normalizeCheckType(context.check_type)
            this.funding.new_contribution = 0
            this.funding.b_purchase_limit = context.b_purchase_limit || 0
            this.funding.b_purchase_status = this.inferBPurchaseStatus(context)
          }
          await this.refreshFullPlan(false)
          await this.refreshRankingState()
        } finally {
          this.planReady = true
        }
      },

      inferBPurchaseStatus(context) {
        if (['unchecked', 'unavailable', 'available'].includes(context.b_purchase_status)) {
          return context.b_purchase_status
        }
        return Number(context.b_purchase_limit) > 0 ? 'available' : 'unchecked'
      },
      needsBCheck() {
        return this.funding.check_type === 'quarterly'
      },

      async loadTransferPlan(refreshTemperature = false) {
        const url = refreshTemperature ? '/api/plan/transfer?refresh_temperature=true' : '/api/plan/transfer'
        const res = await fetch(url)
        if (!res.ok) {
          return
        }
        this.transferPlan = await res.json()
        this.accountReadModel = this.transferPlan?.account_read_model || this.accountReadModel
        this.marketTemperature = this.transferPlan?.market_temperature || this.marketTemperature
        if (this.transferPlan?.plan_date) this.tDate = this.transferPlan.plan_date
      },

      normalizeCheckType(checkType) {
        return ['quarterly', 'b_recovery', 'ad_hoc'].includes(checkType) ? 'quarterly' : 'a_internal'
      },

      async refreshFullPlan(refreshTemperature = false) {
        this.loadingPlan = true
        try {
          await this.loadPlan(refreshTemperature)
          if (this.plan) this.transferPlan = this.plan
        } finally {
          this.loadingPlan = false
        }
      },

      async saveFundingContext() {
        let temperature = Number(this.funding.temperature)
        if (!Number.isFinite(temperature)) {
          const response = await fetch('/api/plan/context')
          if (!response.ok) throw new Error('无法取得当前市场温度，暂不能保存本次计划条件')
          temperature = Number((await response.json()).market_temperature?.temperature)
        }

        const usesB = this.needsBCheck()
        const bStatus = usesB ? this.funding.b_purchase_status : 'unchecked'
        const limit = bStatus === 'available' ? Number(this.funding.b_purchase_limit) : 0
        if (bStatus === 'available' && (!Number.isFinite(limit) || limit <= 0)) {
          throw new Error('B 可申购时必须填写大于 0 的实际单次额度')
        }

        await this.postFundingContext({
          snapshot_date: this.funding.snapshot_date || this.tDate,
          temperature,
          check_type: this.funding.check_type,
          new_contribution: 0,
          b_purchase_status: bStatus,
          b_purchase_limit: limit,
        })
      },

      async postFundingContext(payload) {
        const res = await fetch('/api/account/context', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        })
        if (res.ok) return

        const body = await res.json().catch(() => ({ detail: '保存本次计划条件失败' }))
        const rejectsStatus = Array.isArray(body.detail)
          && body.detail.some(item => item.type === 'extra_forbidden' && item.loc?.includes('b_purchase_status'))
        if (rejectsStatus) {
          const legacyPayload = { ...payload }
          delete legacyPayload.b_purchase_status
          const retry = await fetch('/api/account/context', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(legacyPayload),
          })
          if (retry.ok) return
          const retryBody = await retry.json().catch(() => ({ detail: '保存本次计划条件失败' }))
          throw new Error(this.formatApiError(retryBody, '保存本次计划条件失败'))
        }
        throw new Error(this.formatApiError(body, '保存本次计划条件失败'))
      },

      formatApiError(body, fallback) {
        if (typeof body.detail === 'string') return body.detail
        if (Array.isArray(body.detail)) {
          return body.detail.map(item => {
            const field = Array.isArray(item.loc) ? item.loc?.join('.') : ''
            return [field, item.msg].filter(Boolean).join(': ')
          }).join('\n') || fallback
        }
        return body.detail?.message || fallback
      },

      async generateCompletePlan() {
        this.loadingPlan = true
        this.planError = ''
        this.componentErrors = { cb: '', stock: '' }
        try {
          this.generationStage = '保存计划条件'
          await this.saveFundingContext()
          this.generationStage = '生成完整计划'
          const response = await fetch('/api/plan/generate', { method: 'POST' })
          if (response.status === 404) {
            await this.generateCompletePlanLegacy()
            return
          }
          if (!response.ok) {
            const body = await response.json().catch(() => ({ detail: '完整计划生成失败' }))
            const detail = body.detail || {}
            const lines = (detail.errors || []).map(e => `${e.message}: 更新时间 ${e.date || '无'}，输入窗口 ${e.expected}`)
            throw new Error([detail.message || String(detail || '完整计划生成失败'), ...lines].join('\n'))
          }
          this.plan = await response.json()
          this.accountReadModel = this.plan?.account_read_model || this.accountReadModel
          this.marketTemperature = this.plan?.market_temperature || null
          if (this.plan?.plan_date) {
            this.tDate = this.plan.plan_date
            this.funding.snapshot_date = this.tDate
          }
          this.transferPlan = this.plan
          await this.refreshRankingState()
        } catch (error) {
          this.planError = error.message || '完整计划生成失败'
        } finally {
          this.generationStage = ''
          this.loadingPlan = false
        }
      },

      async generateCompletePlanLegacy() {
        this.generationStage = '检查计划'
        await this.loadPlan(false)
        if (!this.plan) throw new Error(this.planError || '完整计划生成失败')
        for (const strategy of ['cb', 'stock']) {
          this.generationStage = '准备' + this.strategyLabel(strategy) + '榜单'
          await this.ensureRanking(strategy)
        }
        for (const strategy of ['cb', 'stock']) {
          if (this.plan?.[strategy]?.orders?.length) continue
          this.generationStage = '生成' + this.strategyLabel(strategy) + '订单'
          await this.generateOrders(strategy)
        }
        this.transferPlan = this.plan
        await this.refreshRankingState()
      },

      async loadPlan(refreshTemperature = false, suppressDateMismatch = false) {
        this.planError = ''
        const url = refreshTemperature ? '/api/plan?refresh_temperature=true' : '/api/plan'
        const res = await fetch(url)
        if (!res.ok) {
          const body = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }))
          const detail = body.detail || {}
          this.plan = null
          this.marketTemperature = detail.market_temperature || this.marketTemperature
          if (detail.plan_date) {
            this.tDate = detail.plan_date
            this.funding.snapshot_date = this.tDate
          }
          if (suppressDateMismatch && detail.code === 'PLAN_INPUT_DATE_MISMATCH') {
            return
          }
          const lines = (detail.errors || []).map(e => `${e.message}: 更新时间 ${e.date || '无'}，输入窗口 ${e.expected}`)
          this.planError = [detail.message || String(detail || `计划生成失败 (${res.status})`), ...lines].join('\n')
          return
        }
        this.plan = await res.json()
        this.accountReadModel = this.plan?.account_read_model || this.accountReadModel
        this.marketTemperature = this.plan?.market_temperature || null
        if (this.plan?.plan_date) {
          this.tDate = this.plan.plan_date
          this.funding.snapshot_date = this.tDate
        }
      },

      // ── 排名 ──
      async loadCb() {
        if (!this.cbDate) return
        const r = await fetch(`/api/rankings/cb/${this.cbDate}`).then(r => r.json())
        this.cbItems = r.items || []
        this.cbTradeDate = r.trade_date || ''
      },
      async loadStock() {
        if (!this.stockDate) return
        const r = await fetch(`/api/rankings/stock/${this.stockDate}`).then(r => r.json())
        this.stockItems = r.items || []
        this.stockTradeDate = r.trade_date || ''
      },
      async refreshRankingState() {
        const [cbD, stD] = await Promise.all([
          fetch('/api/rankings/cb/dates').then(r => r.json()),
          fetch('/api/rankings/stock/dates').then(r => r.json()),
        ])
        this.cbDates = cbD.sort().reverse(); this.cbDate = this.cbDates.includes(this.tDate) ? this.tDate : ''
        this.stockDates = stD.sort().reverse(); this.stockDate = this.stockDates.includes(this.tDate) ? this.tDate : ''
        if (this.cbDate) await this.loadCb()
        else { this.cbItems = []; this.cbTradeDate = '' }
        if (this.stockDate) await this.loadStock()
        else { this.stockItems = []; this.stockTradeDate = '' }
      },
      async generateRanking(strategy) {
        this.running[strategy] = true
        try {
          const res = await fetch(`/api/rankings/${strategy}/run`, { method: 'POST' })
          if (!res.ok) {
            const body = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }))
            const msg = typeof body.detail === 'object' ? body.detail.message : String(body.detail || `请求失败 (${res.status})`)
            throw new Error(msg)
          }
          const data = await res.json()
          if (data.data_date !== this.tDate) {
            throw new Error(`生成的${this.strategyLabel(strategy)}榜单日期为 ${data.data_date}，与计划基准日 ${this.tDate} 不一致`)
          }
          if (strategy === 'cb') {
            this.cbDate = data.data_date
            this.cbItems = data.items || []
            this.cbTradeDate = data.trade_date || ''
          } else {
            this.stockDate = data.data_date
            this.stockItems = data.items || []
            this.stockTradeDate = data.trade_date || ''
          }
        } finally {
          this.running[strategy] = false
        }
      },
      async ensureRanking(strategy) {
        const missing = (this.plan?.trade_errors || []).some(item => item.input === strategy)
        if (!missing) return
        await this.generateRanking(strategy)
        await this.loadPlan(false)
        if (!this.plan) throw new Error(this.planError || `${this.strategyLabel(strategy)}榜单生成后计划仍不可用`)
      },
      async runStrategy(strategy) {
        this.componentErrors[strategy] = ''
        try {
          await this.generateRanking(strategy)
          await this.loadPlan(false)
          await this.refreshRankingState()
        } catch (error) {
          this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}榜单生成失败`
        }
      },
      async exportMd(strategy) {
        const date = strategy === 'cb' ? this.cbDate : this.stockDate
        const r = await fetch(`/api/rankings/${strategy}/${date}/export`)
        const text = await r.text()
        const blob = new Blob([text], {type: 'text/plain'})
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = `${strategy}_top20_${date}.md`
        a.click()
      },

      // ── 订单 ──
      fmtMoney(v) {
        return v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      },
      signedMoney(v) {
        const amount = Number(v || 0)
        return (amount > 0 ? '+' : amount < 0 ? '-' : '') + this.fmtMoney(Math.abs(amount))
      },
      executionDate() {
        return this.plan?.stock?.trade_date || this.plan?.cb?.trade_date || ''
      },
      temperatureText() {
        const t = (this.plan?.market_temperature || this.marketTemperature)?.temperature
        return t == null ? '-' : `${Number(t).toFixed(0)}°`
      },
      temperatureLabel() {
        return (this.plan?.market_temperature || this.marketTemperature)?.label || ''
      },
      temperatureUpdatedAt() {
        const raw = (this.plan?.market_temperature || this.marketTemperature)?.updated_at
        if (!raw) return ''
        return raw.replace('T', ' ')
      },
      strategyLabel(strategy) {
        return strategy === 'cb' ? '转债' : '股票'
      },
      statusClass(state) {
        if (state === 'ready') return 'bg-green-50 border-green-100 text-green-700'
        if (state === 'failed' || state === 'blocked') return 'bg-red-50 border-red-100 text-red-700'
        if (state === 'missing') return 'bg-amber-50 border-amber-100 text-amber-700'
        return 'bg-gray-50 border-gray-100 text-gray-500'
      },
      strategyStatus(strategy) {
        if (this.componentErrors[strategy]) return { state: 'failed', text: '生成失败' }
        const section = this.plan?.[strategy]
        if (section?.orders?.length) return { state: 'ready', text: '订单已生成' }
        const items = strategy === 'cb' ? this.cbItems : this.stockItems
        if (items.length) return { state: 'missing', text: '榜单已就绪，待生成订单' }
        const missing = (this.plan?.trade_errors || []).some(item => item.input === strategy)
        if (missing) return { state: 'missing', text: '缺少榜单' }
        return { state: 'waiting', text: this.plan ? '暂无订单' : '等待生成' }
      },
      transferStatusText() {
        if (!this.plan?.fund_transfer) return '等待生成'
        const internal = this.plan.fund_transfer.a_internal
        if (internal?.status === 'not_requested') return '账户间资金调拨尚未检查'
        if (internal?.status === 'paused') return internal.pause_reason || '账户间资金调拨等待必要事实'
        return this.fundingActions().length ? `需调拨 ${this.fundingActions().length} 笔` : '已完整检查，本次无需资金调拨'
      },
      readModelAccountById(id) {
        return (this.accountReadModel?.accounts || []).find(item => item.id === id) || null
      },
      readModelPortfolioById(id) {
        return (this.accountReadModel?.portfolios || []).find(item => item.id === id) || null
      },
      fundingLabels() {
        return {
          stock: this.readModelAccountById('stock')?.name || '广发账户',
          bond: this.readModelAccountById('cb')?.name || '华泰账户',
          cash_pool: this.readModelAccountById('cash')?.name || '资金账户',
          A: this.readModelPortfolioById('A')?.name || '主动组合',
          B: this.readModelPortfolioById('B')?.name || '海外长钱',
          C: this.readModelPortfolioById('C')?.name || '国内长钱',
        }
      },
      labelFundingActions(actions) {
        const labels = this.fundingLabels()
        return actions.map(action => ({
          ...action,
          sourceLabel: labels[action.source] || action.source,
          targetLabel: labels[action.target] || action.target,
        }))
      },
      showTopLevelSection() {
        const top = this.plan?.fund_transfer?.top_level
        return Boolean(top && top.check_type !== 'a_internal')
      },
      topLevelActions() {
        const top = this.plan?.fund_transfer?.top_level
        if (!top) return []
        const actions = (top.executed_actions || [])
          .concat(top.outflows || [])
          .filter(action => action.source !== 'A' && action.target !== 'A')
        return this.labelFundingActions(actions)
      },
      aInternalActions() {
        const internal = this.plan?.fund_transfer?.a_internal
        if (!internal) return []
        return this.labelFundingActions(internal.actions || [])
      },
      fundingActions() {
        return this.topLevelActions().concat(this.aInternalActions())
      },
      topLevelStatusText() {
        const top = this.plan?.fund_transfer?.top_level
        if (!top) return '等待组合间再平衡检查'
        if (top.check_type === 'quarterly' && !top.hard_rebalance_triggered) {
          return '组合间偏离未超过阈值，本次无需组合间调拨'
        }
        if (top.b_purchase_status === 'unavailable') {
          return '海外长钱暂不可申购，本次未生成海外买入调拨'
        }
        return '本次无需组合间调拨'
      },
      topLevelRows() {
        const top = this.plan?.fund_transfer?.top_level
        if (!top?.current || !top?.targets) return []
        const labels = this.fundingLabels()
        const planned = top.executed_deltas || {}
        const total = Object.values(top.current || {}).reduce((sum, value) => sum + Number(value || 0), 0)
        return ['A', 'B', 'C'].map(key => {
          const current = Number(top.current[key] || 0)
          const target = Number(top.targets[key] || 0)
          const plannedDelta = Number(planned[key] || 0)
          const remaining = target - current - plannedDelta
          return {
            key, label: labels[key], current, target,
            currentPct: total ? `${(current / total * 100).toFixed(2)}%` : '-',
            targetPct: total ? `${(target / total * 100).toFixed(2)}%` : '-',
            planned: plannedDelta,
            plannedText: this.fundingDeltaText(plannedDelta, '本次'),
            remaining,
            remainingText: this.fundingDeltaText(remaining, '调后'),
          }
        })
      },
      topLevelSummaryRows() {
        const top = this.plan?.fund_transfer?.top_level
        if (!top || top.check_type === 'a_internal') return []
        return this.topLevelRows().map(row => {
          const absRemaining = Math.abs(Number(row.remaining || 0))
          let statusClass = 'bg-gray-100 text-gray-500'
          if (row.key === 'B' && row.remaining > 1000 && top.b_purchase_status === 'unavailable') {
            statusClass = 'bg-amber-50 text-amber-700'
          } else if (absRemaining >= 1000) {
            statusClass = row.remaining > 0 ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'
          }
          return { ...row, statusClass }
        })
      },
      topLevelRowStatus(row) {
        const top = this.plan?.fund_transfer?.top_level
        if (!top?.hard_rebalance_triggered) return '未触发'
        if (row.key === 'B' && row.remaining > 1000 && top.b_purchase_status === 'unavailable') return '暂不可买'
        if (row.remaining > 1000) return '低于目标'
        if (row.remaining < -1000) return '高于目标'
        return '接近目标'
      },
      fundingActionSentence(action) {
        if (action.source === 'cash_pool') {
          return `当日从资金账户转入 ${this.fmtMoney(action.amount)} 到 ${action.targetLabel}`
        }
        if (action.target === 'cash_pool' && action.available_on === 'next_trading_day') {
          return `${action.sourceLabel} 卖出/减仓后 ${this.fmtMoney(action.amount)} 次交易日回流资金账户`
        }
        return `${action.sourceLabel} 调拨 ${this.fmtMoney(action.amount)} 到 ${action.targetLabel}`
      },
      fundingActionTiming(action) {
        if (action.available_on === 'next_trading_day') return '次交易日回流，不参与当日跨账户买入'
        if (action.available_on === 'same_day') return '当日可用于目标账户下单'
        return ''
      },
      fundingActionReason(action) {
        const rows = this.fundingRows()
        const source = rows.find(row => row.key === action.source)
        const target = rows.find(row => row.key === action.target)
        const subject = source?.key !== 'cash_pool' ? source : target
        if (!subject) return ''
        if (action.target === 'cash_pool' && action.available_on === 'next_trading_day') {
          return `${subject.label}高于目标，卖出资金次交易日再回到资金账户`
        }
        if (subject.remaining) {
          if (subject.planned > 0) return `${subject.label}低于目标，转入后仍差 ${this.fmtMoney(subject.remaining)}`
          return `${subject.label}高于目标，转出后仍高出 ${this.fmtMoney(Math.abs(subject.remaining))}`
        }
        return `${subject.label}${subject.planned > 0 ? '低于目标，转入后' : '高于目标，转出后'}回到目标附近`
      },
      aInternalRows() {
        const internal = this.plan?.fund_transfer?.a_internal
        if (!internal?.current || !internal?.final_targets) return []
        const planned = internal.planned_deltas || {}
        const remaining = internal.deferred_gaps || {}
        const labels = this.fundingLabels()
        return [
          ['stock', labels.stock], ['bond', labels.bond], ['cash_pool', labels.cash_pool],
        ].map(([key, label]) => {
          const current = Number(internal.current[key] || 0)
          const target = Number(internal.final_targets[key] || 0)
          const plannedDelta = Number(planned[key] || 0)
          const currentDeviation = target - current
          const deferred = Number(remaining[key] || 0)
          return {
            key, label, current,
            target,
            currentPct: internal.a_exec ? `${(current / internal.a_exec * 100).toFixed(2)}%` : '-',
            targetPct: internal.a_exec ? `${(target / internal.a_exec * 100).toFixed(2)}%` : '-',
            currentDeviation,
            currentDeviationText: this.fundingDeltaText(currentDeviation, '当前'),
            planned: plannedDelta,
            plannedText: this.fundingDeltaText(plannedDelta, '本次'),
            after: current + plannedDelta,
            remaining: deferred,
            remainingText: this.fundingDeltaText(deferred, '调后'),
          }
        })
      },
      fundingRows() {
        return this.topLevelRows().concat(this.aInternalRows())
      },
      hasFundingBasisChildren(row) {
        return row?.key === 'A' && this.aInternalRows().length > 0
      },
      toggleFundingBasis(key) {
        this.basisExpanded[key] = !this.basisExpanded[key]
      },
      fundingBasisRows() {
        const topRows = this.topLevelRows()
        const internalRows = this.aInternalRows()
        if (!topRows.length) {
          return internalRows.map(row => ({ kind: 'top', key: `internal-${row.key}`, row }))
        }
        const rows = []
        topRows.forEach(row => {
          rows.push({ kind: 'top', key: `top-${row.key}`, row })
          if (row.key === 'A' && internalRows.length && this.basisExpanded.A) {
            internalRows.forEach(child => {
              rows.push({ kind: 'child', key: `top-A-${child.key}`, row: child })
            })
          }
        })
        return rows
      },
      fundingDeltaText(delta, stage) {
        const amount = Number(delta || 0)
        if (Math.abs(amount) < 0.005) return stage === '调后' ? '已达目标' : '无偏离'
        if (stage === '调后') {
          return amount > 0
            ? `调后仍需转入 ${this.fmtMoney(amount)}`
            : `调后暂可转出 ${this.fmtMoney(Math.abs(amount))}`
        }
        if (stage === '本次') return `本次${amount > 0 ? '转入' : '转出'} ${this.fmtMoney(Math.abs(amount))}`
        return `当前${amount > 0 ? '需转入' : '可转出'} ${this.fmtMoney(Math.abs(amount))}`
      },
      readinessItems() {
        const transferReady = Boolean(this.plan?.fund_transfer)
        const cb = this.strategyStatus('cb')
        const stock = this.strategyStatus('stock')
        return [
          { label: '账户事实', state: this.plan?.account ? 'ready' : this.planError ? 'blocked' : 'waiting', text: this.plan?.account ? '已就绪' : '等待校验' },
          { label: '资金调拨', state: transferReady ? 'ready' : this.planError ? 'blocked' : 'waiting', text: this.transferStatusText() },
          { label: '转债计划', state: cb.state, text: cb.text },
          { label: '股票计划', state: stock.state, text: stock.text },
        ]
      },
      groupClass(action) {
        if (action === 'BUY' || action === 'ADD') return 'text-green-600'
        if (action === 'SELL') return 'text-red-500'
        if (action === 'TRIM') return 'text-orange-500'
        return 'text-gray-500'
      },
      adjustedCash(strategy) {
        const cf = strategy === 'cb' ? 'bond_cash' : 'stock_cash'
        const dk = strategy === 'cb' ? 'bond' : 'stock'
        const base = this.plan?.account?.[cf.replace('_cash', '_available_cash')] ?? this.plan?.account?.[cf] ?? 0
        const delta = (this.plan?.transfer_deltas || this.transferPlan?.transfer_deltas)?.[dk] || 0
        // 正delta(入金)当日可用, 负delta(转出)必须预留
        return Math.round(base + delta)
      },
      orderCashDelta(strategy) {
        const orders = this.plan?.[strategy]?.orders || []
        const sells = orders
          .filter(order => (order.delta_shares ?? order.shares ?? 0) < 0)
          .reduce((sum, order) => sum + Number(order.amount || 0), 0)
        const buys = orders
          .filter(order => (order.delta_shares ?? order.shares ?? 0) > 0)
          .reduce((sum, order) => sum + Number(order.amount || 0), 0)
        return Math.round((sells - buys) * 100) / 100
      },
      orderShares(order) {
        return Number(order?.delta_shares ?? order?.shares ?? 0)
      },
      orderQuantityText(order, unit) {
        const shares = this.orderShares(order)
        return `${shares > 0 ? '+' : ''}${shares}${unit}`
      },
      orderQuantityClass(order) {
        const shares = this.orderShares(order)
        if (shares > 0) return 'text-green-600'
        if (shares < 0) return 'text-red-500'
        return 'text-gray-400'
      },
      orderReferencePrice(order) {
        const price = Number(order?.price)
        return Number.isFinite(price) && price > 0 ? price.toFixed(3) : '-'
      },
      orderGroupColumns(groups) {
        const byAction = Object.fromEntries(groups.map(group => [group.action, group]))
        return [
          ['SELL', 'BUY'].map(action => byAction[action]).filter(Boolean),
          ['TRIM', 'ADD'].map(action => byAction[action]).filter(Boolean),
        ].filter(column => column.length)
      },
      cashSummary(strategy) {
        if (!this.plan?.[strategy]?.orders?.length || !this.plan?.account) return null
        const accountKey = strategy === 'cb' ? 'bond_available_cash' : 'stock_available_cash'
        const transferKey = strategy === 'cb' ? 'bond' : 'stock'
        const startingCash = Number(this.plan.account[accountKey] || 0)
        const transferDelta = Number((this.plan.transfer_deltas || {})[transferKey] || 0)
        const sameDayTransfer = Math.max(transferDelta, 0)
        const nextDayReturn = Math.max(-transferDelta, 0)
        const orderDelta = this.orderCashDelta(strategy)
        const cashLeft = startingCash + sameDayTransfer + orderDelta - nextDayReturn
        return {
          starting_cash: Math.round(startingCash * 100) / 100,
          transfer_delta: Math.round(transferDelta * 100) / 100,
          same_day_transfer: Math.round(sameDayTransfer * 100) / 100,
          next_day_return: Math.round(nextDayReturn * 100) / 100,
          order_delta: Math.round(orderDelta * 100) / 100,
          cash_left: Math.round(cashLeft * 100) / 100,
        }
      },
      async generateOrders(strategy) {
        if (!this.plan?.account) throw new Error('请先在账户页补齐账户事实')
        const response = await fetch(`/api/plan/${strategy}/size-orders`, { method: 'POST' })
        if (!response.ok) {
          const body = await response.json().catch(() => ({ detail: '订单生成失败' }))
          const detail = body.detail || {}
          throw new Error(typeof detail === 'string' ? detail : detail.message || `${this.strategyLabel(strategy)}订单生成失败`)
        }
        await this.loadPlan(false)
        if (!this.plan) throw new Error(this.planError || `${this.strategyLabel(strategy)}订单生成后计划不可用`)
      },
      async sizeOrders(strategy) {
        const key = strategy === 'cb' ? 'sizingCb' : 'sizingStock'
        this.componentErrors[strategy] = ''
        this[key] = true
        try {
          await this.generateOrders(strategy)
        } catch (error) {
          this.componentErrors[strategy] = error.message || `${this.strategyLabel(strategy)}订单生成失败`
        } finally { this[key] = false }
      },
      cbGroups() {
        const orders = this.plan?.cb?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && this.orderShares(r) !== 0)
        })).filter(g => g.items.length)
      },
      stockGroups() {
        const orders = this.plan?.stock?.orders || []
        return ['SELL','TRIM','BUY','ADD'].map(action => ({
          label: {SELL:'卖出', BUY:'买入', ADD:'加仓', TRIM:'减仓'}[action], action,
          items: orders.filter(r => r.action === action && this.orderShares(r) !== 0)
        })).filter(g => g.items.length)
      },
    }
  }
</script>
